<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>MZBOX AI</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--ink:#192438;--muted:#8290a5;--line:#e6ebf2;--green:#168568;--red:#c94f5a;--blue:#536de0;--shadow:0 5px 24px #20365b08}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.dark{color-scheme:dark;--bg:#0e1219;--card:#161c26;--ink:#edf2fa;--muted:#99a7bb;--line:#2a3443;--shadow:0 5px 24px #0003}
button,input{font:inherit}button{cursor:pointer}
main{max-width:960px;margin:auto;padding:18px 15px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:3px 0 20px}
.brand{font-size:23px;font-weight:850;letter-spacing:-.8px}
.subtitle{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.actions{display:flex;gap:6px}
.square{width:29px;height:29px;padding:0;border:1px solid #9ba7b9;border-radius:5px;background:var(--card);color:var(--ink)}
.theme{background:linear-gradient(135deg,#26354e 0 49%,#fff 51%)}
body.dark .theme{background:linear-gradient(135deg,#fff 0 49%,#26354e 51%)}
.section{font-size:10px;font-weight:800;letter-spacing:1.15px;color:var(--muted);margin:19px 2px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--blue)}
.tokenrow{display:flex;gap:8px;margin-top:9px}
.tokenrow input{flex:1;min-width:0}
.btn{border:0;border-radius:9px;padding:10px 13px;background:#24334c;color:#fff;font-weight:700}
body.dark .btn{background:#e0e8f7;color:#172238}
.btn:disabled{opacity:.5}
.note{font-size:10px;color:var(--muted);margin-top:7px}
.status{font-size:11px;color:var(--muted);margin-top:9px;overflow-wrap:anywhere}
.status.error{color:var(--red)}
.locked{background:#f0f3f8!important;color:#77849a!important}
body.dark .locked{background:#222b39!important;color:#a8b4c7!important}
.refreshrow{display:flex;justify-content:center;margin:10px 0 14px}
.refresh{width:min(250px,75%);padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:12px;font-weight:650}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat span{display:block;font-size:10px;color:var(--muted)}
.stat strong{display:block;font-size:19px;margin-top:4px;overflow-wrap:anywhere}
.pos{color:var(--green)!important}.neg{color:var(--red)!important}
.asset{overflow:hidden}
.asset summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;list-style:none}
.asset summary::-webkit-details-marker{display:none}
.assetname{font-size:14px;font-weight:780}
.sub{font-size:11px;color:var(--muted);margin-top:3px}
.price{text-align:right;font-size:15px;font-weight:750;white-space:nowrap}
.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
.pill{font-size:9px;font-weight:800;border-radius:999px;padding:5px 8px}
.buy{background:#e3f7ed;color:#137c50}.hold{background:#edf1ff;color:#4058c3}.sell{background:#fff0ee;color:#b63d35}
body.dark .buy{background:#183b2c;color:#9ce4bd}body.dark .hold{background:#252f4d;color:#bbc8ff}body.dark .sell{background:#40262b;color:#ffb4b4}
.detail{border-top:1px solid var(--line);margin-top:13px;padding-top:13px}
.charthead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.charttitle{font-size:12px;font-weight:750}.chartsub{font-size:10px;color:var(--muted);margin-top:3px}
.chartwrap{border:1px solid var(--line);border-radius:12px;padding:7px;background:var(--card);overflow:hidden}
canvas{width:100%;height:260px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin:8px 2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.levels,.fcgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.level,.fc{border:1px solid var(--line);border-radius:11px;padding:10px;min-width:0}
.level span,.fc span{font-size:10px;color:var(--muted);display:block}
.level b,.fc b{display:block;font-size:15px;margin-top:4px;overflow-wrap:anywhere}
.fc small{font-size:10px;color:var(--muted);display:block;margin-top:3px}
.scenario{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.scenariohead{padding:10px;background:#f7f9fc;border-bottom:1px solid var(--line);font-size:11px;font-weight:750}
body.dark .scenariohead{background:#1c2430}
.scenariolist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.point{padding:9px 7px;border-bottom:1px solid var(--line);min-width:0}
.point:not(:nth-child(3n+1)){border-left:1px solid var(--line)}
.point .time{font-size:10px;color:var(--muted)}
.point .value{font-size:12px;font-weight:750;margin-top:3px;overflow-wrap:anywhere}
.point .move{font-size:9px;margin-top:2px}
.analysis{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:inset 3px 0 #9a7be7}
.analysis h3{font-size:12px;margin:0 0 6px}
.analysis p{font-size:12px;line-height:1.55;color:var(--muted);margin:0}
.gate{padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center;background:var(--bg)}
.gate p{font-size:12px;color:var(--muted);margin:0 0 10px}
.pinrow{display:flex;gap:7px;max-width:280px;margin:auto}
.pin{min-width:0;text-align:center;letter-spacing:5px;font-weight:750}
.openbtn{padding:9px 12px;border:0;border-radius:9px;background:#24334c;color:#fff;font-size:11px;font-weight:700}
body.dark .openbtn{background:#e0e8f7;color:#172238}
.errorpin{font-size:10px;color:var(--red);margin-top:7px}
.unlocked{display:none}.unlocked.show{display:block}
.trade{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px}
.tradehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tradehead h3{font-size:12px;margin:0}
.auto{font-size:9px;letter-spacing:.5px;font-weight:800;background:#e3f7ed;color:#137c50;border-radius:7px;padding:5px 7px}
.tradegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tradebox{padding:11px;border:1px solid var(--line);border-radius:11px;min-width:0}
.tradebox.accent{background:#f2f5ff;border-color:#e1e6ff}
body.dark .tradebox.accent{background:#1b2337;border-color:#2c3856}
.tradebox span{display:block;font-size:10px;color:var(--muted)}
.tradebox strong{display:block;font-size:19px;margin-top:5px;overflow-wrap:anywhere}
.tradebox small{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.tradehint{font-size:10px;color:var(--muted);line-height:1.5;margin-top:9px}
.footer{text-align:center;color:var(--muted);font-size:10px;margin-top:20px;line-height:1.8}
.empty{text-align:center;padding:22px;color:var(--muted);font-size:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.assetgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.assetgrid .asset{margin:0}}
@media(max-width:430px){main{padding:13px 11px 25px}.card{padding:12px}.brand{font-size:21px}.stat strong{font-size:17px}.scenariolist{grid-template-columns:repeat(2,minmax(0,1fr))}.point:not(:nth-child(3n+1)){border-left:0}.point:nth-child(even){border-left:1px solid var(--line)}.tokenrow{flex-direction:column}.tradegrid{grid-template-columns:1fr}.chartwrap canvas{height:225px}}
</style>
</head>
<body>
<main>
<header>
 <div><div class="brand">MZBOX AI</div><div class="subtitle">INVESTMENT SYSTEM</div></div>
 <div class="actions"><button class="square" id="reset" title="Сбросить токен">↻</button><button class="square theme" id="theme" title="Сменить тему"></button></div>
</header>

<div class="section">ПОДКЛЮЧЕНИЕ</div>
<section class="card">
 <label for="token">Токен T-Invest</label>
 <input id="token" type="password" autocomplete="off" placeholder="Вставь токен API">
 <div class="tokenrow"><button class="btn" id="run">Запустить</button></div>
 <div class="note">Токен сохраняется на этом устройстве. ↻ — сбросить токен.</div>
 <div class="status" id="status">Ожидание подключения.</div>
</section>

<div class="refreshrow"><button class="refresh" id="refresh">Актуализировать</button></div>

<section class="stats">
 <div class="stat"><span>КАПИТАЛ ПОРТФЕЛЯ</span><strong id="total">—</strong></div>
 <div class="stat"><span>ПОЗИЦИИ</span><strong id="count">—</strong></div>
 <div class="stat"><span>РЕЗУЛЬТАТ</span><strong id="pnl">—</strong></div>
 <div class="stat"><span>ДОХОДНОСТЬ</span><strong id="ret">—</strong></div>
</section>

<div class="section">АКТИВЫ ПОРТФЕЛЯ</div>
<div id="assets"><section class="card empty">Введи токен и нажми «Запустить».</section></div>

<div class="footer">MZBOX AI<br>Не является индивидуальной инвестиционной рекомендацией</div>
</main>

<script>
'use strict';
const BASE='https://invest-public-api.tinkoff.ru/rest/tinkoff.public.invest.api.contract.v1.';
const EP={
 accounts:BASE+'UsersService/GetAccounts',
 portfolio:BASE+'OperationsService/GetPortfolio',
 last:BASE+'MarketDataService/GetLastPrices',
 candles:BASE+'MarketDataService/GetCandles'
};
const $=id=>document.getElementById(id);
const S={token:localStorage.getItem('mzbox_token')||'',rows:[],dark:localStorage.getItem('mzbox_theme')==='dark',busy:false};
const num=v=>{if(v==null)return 0;if(typeof v==='number')return v;return Number(v.units||0)+Number(v.nano||0)/1e9};
const money=v=>Number(v||0).toLocaleString('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2});
const percent=v=>(Number(v||0)*100).toLocaleString('ru-RU',{maximumFractionDigits:2})+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(t,e=false){$('status').textContent=t;$('status').classList.toggle('error',e)}
function setTheme(){document.body.classList.toggle('dark',S.dark);localStorage.setItem('mzbox_theme',S.dark?'dark':'light')}
function setTokenUI(){const el=$('token');el.value=S.token;el.readOnly=!!S.token;el.classList.toggle('locked',!!S.token);$('run').textContent=S.token?'Подключено':'Запустить'}
async function api(url,body){
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),20000);
 try{
  const res=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+S.token,'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
  const raw=await res.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{}
  if(!res.ok)throw Error(data.message||`HTTP ${res.status}`);return data;
 }finally{clearTimeout(timer)}
}
async function getAccounts(){return (await api(EP.accounts,{})).accounts||[]}
async function getPortfolio(id){return (await api(EP.portfolio,{accountId:id})).positions||[]}
async function getLast(ids){if(!ids.length)return[];return(await api(EP.last,{instrumentId:ids.map(instrumentId=>({instrumentId}))})).lastPrices||[]}
async function getCandles(uid,interval,days){
 const to=new Date(),from=new Date(to.getTime()-days*86400000);
 const d=await api(EP.candles,{instrumentId:uid,from:from.toISOString(),to:to.toISOString(),interval});
 return(d.candles||[]).map(c=>({time:new Date(c.time).getTime(),o:num(c.open),h:num(c.high),l:num(c.low),c:num(c.close),v:num(c.volume)})).filter(c=>c.time&&c.c>0).sort((a,b)=>a.time-b.time)
}
function normalize(positions,prices){
 const map=new Map(prices.map(p=>[p.instrumentUid||p.instrumentId,num(p.price)]));
 return positions.filter(p=>num(p.quantity)>0).map(p=>{
  const uid=p.instrumentUid||p.instrumentId,qty=num(p.quantity),avg=num(p.averagePositionPrice),price=map.get(uid)||num(p.currentPrice)||avg,value=qty*price,pnl=value-qty*avg;
  return{uid,ticker:p.ticker||p.figi||uid,name:p.name||p.ticker||uid,qty,avg,price,value,pnl,ret:qty*avg?pnl/(qty*avg):0};
 }).sort((a,b)=>b.value-a.value)
}
async function refresh(){
 if(S.busy)return;
 if(!S.token){setStatus('Сначала введи токен.',true);return}
 S.busy=true;$('refresh').disabled=$('run').disabled=true;$('refresh').textContent='Актуализируем…';setStatus('Загружаю портфель…');
 try{
  const accounts=await getAccounts();if(!accounts.length)throw Error('Не найдено инвестиционных счетов.');
  const groups=await Promise.all(accounts.map(a=>getPortfolio(a.id)));
  const positions=groups.flat(),ids=[...new Set(positions.map(p=>p.instrumentUid||p.instrumentId).filter(Boolean))];
  const prices=await getLast(ids).catch(()=>[]);
  S.rows=normalize(positions,prices);render();
  setStatus('Обновлено: '+new Date().toLocaleString('ru-RU'));
 }catch(e){setStatus('Ошибка: '+e.message+(String(e.message).toLowerCase().includes('fetch')?' Возможно, браузер блокирует CORS.':' Проверь токен и права API.'),true)}
 finally{S.busy=false;$('refresh').disabled=$('run').disabled=false;$('refresh').textContent='Актуализировать'}
}
function render(){
 const rows=S.rows,total=rows.reduce((a,r)=>a+r.value,0),pnl=rows.reduce((a,r)=>a+r.pnl,0),cost=total-pnl;
 $('total').textContent=money(total);$('count').textContent=rows.length;$('pnl').textContent=(pnl>0?'+':'')+money(pnl);$('pnl').className=pnl>=0?'pos':'neg';$('ret').textContent=cost?percent(pnl/cost):'—';
 if(!rows.length){$('assets').innerHTML='<section class="card empty">Открытые позиции не найдены.</section>';return}
 $('assets').innerHTML='<div class="assetgrid">'+rows.map((r,i)=>`
 <details class="card asset" data-i="${i}">
 <summary><div><div class="assetname">${esc(r.name)}</div><div class="sub">${esc(r.ticker)} · ${r.qty.toLocaleString('ru-RU')} шт.</div><div class="meta"><span class="pill hold" id="signal-${i}">АНАЛИЗ…</span><span class="small ${r.pnl>=0?'pos':'neg'}">${r.pnl>=0?'+':''}${money(r.pnl)}</span></div></div><div class="price">${money(r.price)}<div class="sub">за акцию</div></div></summary>
 <div class="detail">
 <div class="gate" id="gate-${i}"><p>Анализ и прогноз скрыты. Введи код на сегодня.</p><div class="pinrow"><input class="pin" id="pin-${i}" inputmode="numeric" type="password" maxlength="4" placeholder="••••"><button class="openbtn" data-unlock="${i}">Открыть</button></div><div class="errorpin" id="pinerr-${i}"></div></div>
 <div class="unlocked" id="locked-${i}">
 <div class="charthead"><div><div class="charttitle">Движение цены и прогноз</div><div class="chartsub" id="chartnote-${i}">Загрузка истории…</div></div></div>
 <div class="chartwrap"><canvas id="chart-${i}"></canvas></div>
 <div class="legend"><span><i class="dot" style="background:#168568"></i>История роста</span><span><i class="dot" style="background:#c94f5a"></i>История падения</span><span><i class="dot" style="background:#9474df"></i>Сценарий</span></div>
 <div class="levels"><div class="level"><span>ПОДДЕРЖКА</span><b id="support-${i}">—</b></div><div class="level"><span>СОПРОТИВЛЕНИЕ</span><b id="resistance-${i}">—</b></div></div>
 <div class="fcgrid"><div class="fc"><span>СЦЕНАРИЙ · 7 ДНЕЙ</span><b id="f7-${i}">—</b><small id="f7pct-${i}"></small></div><div class="fc"><span>СЦЕНАРИЙ · 30 ДНЕЙ</span><b id="f30-${i}">—</b><small id="f30pct-${i}"></small></div></div>
 <div class="scenario"><div class="scenariohead">Внутридневной сценарий · шаг 60 минут</div><div class="scenariolist" id="path-${i}"></div></div>
 <div class="analysis"><h3>Интеллектуальный вывод</h3><p id="analysis-${i}">Расчёт…</p></div>
 <div class="trade"><div class="tradehead"><h3>Расчёт потенциальной сделки</h3><span class="auto">АВТОРАСЧЁТ</span></div>
 <div class="tradegrid"><div class="tradebox"><span>Количество акций</span><strong id="tradeqty-${i}">—</strong><small>Текущая позиция</small></div><div class="tradebox"><span>Текущая цена</span><strong id="tradeprice-${i}">—</strong><small>Цена по API</small></div>
 <div class="tradebox accent"><span>Продажа по сценарию</span><strong id="tradesell-${i}">—</strong><small id="tradesellmeta-${i}">Оценка на ближайший период</small></div><div class="tradebox"><span>Результат при продаже</span><strong id="tradeprofit-${i}">—</strong><small id="tradeprofitmeta-${i}">Относительно средней цены покупки</small></div></div>
 <div class="tradehint" id="tradehint-${i}">Расчёт автоматически использует размер текущей позиции и среднюю цену покупки. Комиссии и налоги не учтены.</div></div>
 </div></div></details>`).join('')+'</div>';
 $('assets').querySelectorAll('details.asset').forEach(el=>el.addEventListener('toggle',()=>{if(el.open)loadDetail(Number(el.dataset.i))}));
 $('assets').querySelectorAll('[data-unlock]').forEach(b=>b.addEventListener('click',()=>unlock(Number(b.dataset.unlock))));
 $('assets').querySelectorAll('.pin').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')unlock(Number(inp.id.split('-')[1]))}));
}
function dailyCode(){const d=new Date();return String(d.getFullYear()+d.getMonth()+1+d.getDate())}
function unlock(i){
 const inp=$('pin-'+i),err=$('pinerr-'+i);
 if(inp.value===dailyCode()){$('gate-'+i).classList.add('hidden');$('locked-'+i).classList.add('show');inp.value='';return}
 err.textContent='Неверный код. Проверь дату.';inp.value='';inp.focus()
}
function ema(a,p){if(!a.length)return 0;let v=a[0],k=2/(p+1);for(let i=1;i<a.length;i++)v=a[i]*k+v*(1-k);return v}
function model(cs,hourly,price){
 const closes=cs.map(c=>c.c).filter(v=>v>0);if(closes.length<12)return{ok:false,reason:'Недостаточно исторических данных для прогноза.'};
 const tail=closes.slice(-Math.min(90,closes.length)),logs=tail.map(Math.log),n=logs.length,xb=(n-1)/2,yb=logs.reduce((a,b)=>a+b,0)/n;let cov=0,variance=0;
 for(let i=0;i<n;i++){cov+=(i-xb)*(logs[i]-yb);variance+=(i-xb)**2}
 const slope=variance?cov/variance:0,fast=ema(closes.slice(-40),9),slow=ema(closes.slice(-80),21);
 const returns=[];for(let i=Math.max(1,closes.length-60);i<closes.length;i++)returns.push(Math.log(closes[i]/closes[i-1]));
 const avg=returns.reduce((a,b)=>a+b,0)/(returns.length||1),vol=Math.sqrt(returns.reduce((a,b)=>a+(b-avg)**2,0)/Math.max(1,returns.length-1));
 const hc=(hourly||[]).map(c=>c.c).filter(v=>v>0).slice(-36),hourTrend=hc.length>1?Math.log(hc.at(-1)/hc[0])/Math.max(1,hc.length-1):slope;
 const recent=closes.slice(-15);let gains=0,losses=0;for(let i=1;i<recent.length;i++){let d=recent[i]-recent[i-1];if(d>0)gains+=d;else losses-=d}
 const rsi=100-100/(1+gains/(losses||1e-9));
 const lows=cs.slice(-90).map(c=>c.l).filter(v=>v<price).sort((a,b)=>b-a),highs=cs.slice(-90).map(c=>c.h).filter(v=>v>price).sort((a,b)=>a-b);
 const support=lows[0]||price*(1-vol*2),resistance=highs[0]||price*(1+vol*2);
 const trend=fast>slow*1.003&&slope>0?'восходящий':fast<slow*.997&&slope<0?'нисходящий':'боковой';
 const drift=Math.max(-.02,Math.min(.02,.62*slope+.23*hourTrend+.15*avg));
 const intraday=[];let p=price;
 const hvol=hc.length>3?Math.sqrt(hc.slice(1).reduce((s,v,i)=>s+Math.pow(Math.log(v/hc[i]),2),0)/(hc.length-1)):Math.max(vol/Math.sqrt(18),.001);
 for(let k=1;k<=12;k++){const wave=Math.sin(k*1.1+rsi/43)*hvol*.55+Math.sin(k*.53)*hvol*.3;let delta=drift*.12+wave;if(rsi>70)delta-=hvol*.15;if(rsi<30)delta+=hvol*.15;p*=Math.exp(Math.max(-.025,Math.min(.025,delta)));intraday.push({time:Date.now()+k*3600000,price:p})}
 const p7=price*Math.exp(drift*7),p30=price*Math.exp(drift*30);
 let advice=trend==='восходящий'&&rsi<68?'Преимущество у покупателей. Рассматривать вход лучше на откате к поддержке либо после подтверждённого пробоя сопротивления.':trend==='нисходящий'?'Давление продавцов сохраняется. Покупку лучше не торопить до признаков разворота.':'Выраженного преимущества нет. Рациональнее дождаться выхода из диапазона и подтверждения направления.';
 return{ok:true,price,vol,rsi,support,resistance,trend,drift,intraday,p7,p30,advice,fast,slow}
}
function draw(canvas,cs,m,price){
 const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,W=Math.max(280,canvas.clientWidth||500),H=canvas.clientHeight||260;
 canvas.width=W*dpr;canvas.height=H*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
 if(!cs.length){ctx.fillStyle='#8290a5';ctx.fillText('История цены недоступна',12,25);return}
 const hist=cs.slice(-65),future=m?.ok?m.intraday:[],pad={l:8,r:65,t:15,b:24},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
 const vals=hist.flatMap(c=>[c.l,c.h,c.o,c.c]).concat(future.flatMap(p=>[p.price]),[price,m?.support,m?.resistance]).filter(Number.isFinite);
 let min=Math.min(...vals),max=Math.max(...vals);if(max<=min){min*=.98;max*=1.02}const extra=(max-min)*.09;min-=extra;max+=extra;
 const y=v=>pad.t+(max-v)/(max-min)*ch,total=hist.length+future.length,slot=cw/Math.max(1,total),body=Math.max(2,Math.min(7,slot*.62));
 const dark=document.body.classList.contains('dark');ctx.strokeStyle=dark?'#293342':'#e9edf4';ctx.fillStyle=dark?'#9ba7ba':'#8792a5';ctx.font='10px sans-serif';
 for(let i=0;i<=4;i++){const yy=pad.t+ch*i/4;ctx.beginPath();ctx.moveTo(pad.l,yy);ctx.lineTo(W-pad.r,yy);ctx.stroke();ctx.fillText((max-(max-min)*i/4).toLocaleString('ru-RU',{maximumFractionDigits:2}),W-pad.r+4,yy+3)}
 hist.forEach((c,i)=>{const x=pad.l+i*slot+slot/2,up=c.c>=c.o;ctx.strokeStyle=up?'#168568':'#c94f5a';ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(x,y(c.h));ctx.lineTo(x,y(c.l));ctx.stroke();ctx.fillRect(x-body/2,Math.min(y(c.o),y(c.c)),body,Math.max(1,Math.abs(y(c.o)-y(c.c))))});
 if(future.length){const start=pad.l+hist.length*slot;ctx.strokeStyle='#9474df';ctx.lineWidth=2;ctx.beginPath();future.forEach((p,i)=>{const x=start+i*slot+slot/2;i?ctx.lineTo(x,y(p.price)):ctx.moveTo(x,y(p.price))});ctx.stroke();ctx.lineWidth=1;ctx.fillStyle='#9474df';future.forEach((p,i)=>{const x=start+i*slot+slot/2;ctx.beginPath();ctx.arc(x,y(p.price),2,0,Math.PI*2);ctx.fill()})}
 if(m?.support){ctx.strokeStyle='#168568';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,y(m.support));ctx.lineTo(W-pad.r,y(m.support));ctx.stroke();ctx.setLineDash([])}
 if(m?.resistance){ctx.strokeStyle='#c94f5a';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,y(m.resistance));ctx.lineTo(W-pad.r,y(m.resistance));ctx.stroke();ctx.setLineDash([])}
 ctx.fillStyle=dark?'#9ba7ba':'#8792a5';ctx.font='9px sans-serif';ctx.fillText('История',pad.l,H-7);ctx.textAlign='right';ctx.fillText('+12 ч',W-pad.r,H-7);ctx.textAlign='left'
}
function renderTrade(i,r,m){
 const qty=r.qty,buy=r.avg||r.price,now=r.price,target=m.p7,profit=(target-buy)*qty;
 $('tradeqty-'+i).textContent=qty.toLocaleString('ru-RU')+' шт.';
 $('tradeprice-'+i).textContent=money(now);
 $('tradesell-'+i).textContent=money(target);
 $('tradesellmeta-'+i).textContent='Расчётный ориентир на 7 дней';
 $('tradeprofit-'+i).textContent=(profit>0?'+':'')+money(profit);
 $('tradeprofit-'+i).className=profit>=0?'pos':'neg';
 $('tradeprofitmeta-'+i).textContent='Относительно средней цены покупки '+money(buy);
 $('tradehint-'+i).textContent=`Если продать всю позицию по расчётному ориентиру ${money(target)}, результат относительно средней цены покупки составит ${money(profit)}. От текущей рыночной стоимости разница — ${money((target-now)*qty)}. Оценка до комиссий и налогов; сценарий не гарантирован.`
}
async function loadDetail(i){
 const r=S.rows[i];if(!r||r.loading)return;r.loading=true;
 try{
  const [daily,hourly]=await Promise.all([getCandles(r.uid,'CANDLE_INTERVAL_DAY',400),getCandles(r.uid,'CANDLE_INTERVAL_HOUR',60).catch(()=>[])]);
  r.loading=false;r.candles=daily.length>=12?daily:hourly;
  const m=model(r.candles,hourly,r.price);r.model=m;
  if(!m.ok){$('analysis-'+i).textContent=m.reason;return}
  $('chartnote-'+i).textContent=`Тренд ${m.trend} · RSI ${m.rsi.toFixed(0)} · волатильность ${percent(m.vol)}`;
  $('support-'+i).textContent=money(m.support);$('resistance-'+i).textContent=money(m.resistance);
  $('f7-'+i).textContent=money(m.p7);$('f7pct-'+i).textContent=percent(m.p7/r.price-1)+' к текущей цене';
  $('f30-'+i).textContent=money(m.p30);$('f30pct-'+i).textContent=percent(m.p30/r.price-1)+' к текущей цене';
  $('analysis-'+i).textContent=m.advice+` Поддержка ${money(m.support)}, сопротивление ${money(m.resistance)}. RSI ${m.rsi.toFixed(0)}; риск ${m.vol>.035?'высокий':m.vol<.012?'умеренно низкий':'умеренный'}. Расчётный сценарий на 7 дней ${money(m.p7)} (${percent(m.p7/r.price-1)}), на 30 дней ${money(m.p30)} (${percent(m.p30/r.price-1)}). Это оценка по историческим данным, не гарантия движения цены.`;
  const signal=m.trend==='восходящий'&&m.rsi<68?'ПОКУПАТЬ':m.trend==='нисходящий'?'ПРОДАВАТЬ':'ДЕРЖАТЬ';
  $('signal-'+i).textContent=signal;$('signal-'+i).className='pill '+(signal==='ПОКУПАТЬ'?'buy':signal==='ПРОДАВАТЬ'?'sell':'hold');
  $('path-'+i).innerHTML=m.intraday.map((p,k)=>{const prev=k?m.intraday[k-1].price:m.price,d=p.price-prev;return`<div class="point"><div class="time">${new Date(p.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div><div class="value">${money(p.price)}</div><div class="move ${d>=0?'pos':'neg'}">${d>=0?'+':''}${percent(d/prev)}</div></div>`}).join('');
  renderTrade(i,r,m);draw($('chart-'+i),r.candles,m,r.price)
 }catch(e){r.loading=false;$('analysis-'+i).textContent='Не удалось получить историю: '+e.message}
}
$('run').addEventListener('click',async()=>{if(S.token){await refresh();return}const t=$('token').value.trim();if(!t){setStatus('Введи токен T-Invest.',true);return}S.token=t;localStorage.setItem('mzbox_token',t);setTokenUI();await refresh()});
$('refresh').addEventListener('click',refresh);
$('reset').addEventListener('click',()=>{if(!confirm('Сбросить сохранённый токен?'))return;S.token='';S.rows=[];localStorage.removeItem('mzbox_token');setTokenUI();$('assets').innerHTML='<section class="card empty">Введи токен и нажми «Запустить».</section>';['total','count','pnl','ret'].forEach(id=>$(id).textContent='—');setStatus('Токен сброшен.')});
$('theme').addEventListener('click',()=>{S.dark=!S.dark;setTheme();S.rows.forEach((r,i)=>{if(r.model&&$('chart-'+i))draw($('chart-'+i),r.candles,r.model,r.price)})});
setTokenUI();setTheme();
if(S.token)setStatus('Токен сохранён. Нажми «Актуализировать».');
window.addEventListener('resize',()=>S.rows.forEach((r,i)=>{if(r.model&&$('chart-'+i))draw($('chart-'+i),r.candles,r.model,r.price)}));
</script>
