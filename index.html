<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>INJECTUM</title>

<style>
:root {
  --bg: #000000;
  --panel: #141414;
  --panel2: #171717;
  --line: #2a2a2a;
  --text: #f2f2ef;
  --muted: #8a8a82;
  --accent: #d9d3bd;
  --green: #6fbf95;
  --red: #d98982;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
.app { max-width: 980px; margin: 0 auto; padding: 16px 14px 28px; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.logo {
  font-size: 20px;
  letter-spacing: 3px;
  font-weight: 650;
  color: var(--text);
  user-select: none;
  pointer-events: none;
}
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.small-btn {
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12px;
}
.small-btn:hover { border-color: #555; }

.screen { display: none; }
.screen.active { display: block; }

.welcome-strip {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.welcome-left strong { display: block; font-size: 18px; font-weight: 500; }
.welcome-left span { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
.welcome-quote { font-size: 12px; color: var(--muted); line-height: 1.5; max-width: 55%; text-align: right; }
.welcome-quote em { display: block; margin-top: 6px; font-style: normal; color: #6a6a64; font-size: 10px; }

.briefing {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
}
.brief-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brief-top h2 { font-size: 13px; letter-spacing: 1.5px; font-weight: 600; margin: 0; }
.brief-top span { font-size: 11px; color: var(--muted); }
.brief-dates {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
}
.brief-date {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 12px;
  background: var(--panel2);
  border-radius: 10px;
  font-size: 12px;
}
.brief-date span:last-child {
  color: #c9877e;
  white-space: nowrap;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}
.section-label {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin: 18px 0 10px;
}
.finance-overview {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
  margin-top: 14px;
}
.metric {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
}
.metric span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 8px; }
.metric strong { font-size: 17px; font-weight: 550; overflow-wrap: anywhere; }
.metric small { display: block; color: var(--muted); font-size: 10px; margin-top: 5px; }

.smart-finance {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #101010;
}
.smart-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid #222;
  font-size: 12px;
}
.smart-row:last-child { border-bottom: 0; }
.smart-row span { color: var(--muted); }
.smart-bar {
  height: 8px;
  background: #1c1c1c;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 10px;
}
.smart-bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.fin-pulse {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.fin-pulse .cell {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #151515;
}
.fin-pulse .cell span {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 6px;
}
.fin-pulse .cell b { font-size: 16px; font-weight: 550; }
.positive { color: var(--green) !important; }
.negative { color: var(--red) !important; }

.dashboard {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.nav-card {
  min-height: 120px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  background: var(--panel2);
  color: var(--text);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  -webkit-appearance: none;
  appearance: none;
}
.nav-card:hover { border-color: #555; }
.nav-card .num { font-size: 10px; color: var(--muted); letter-spacing: 2px; }
.nav-card .name { font-size: 15px; letter-spacing: 1px; }
.nav-card .count { font-size: 18px; font-weight: 500; }

.section-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.section-top h1 {
  font-size: 20px;
  font-weight: 550;
  margin: 0;
  letter-spacing: 1px;
}
.section-actions { display: flex; gap: 8px; }
.icon-btn-sq {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel2);
  color: var(--text);
  font-size: 18px;
  display: grid;
  place-items: center;
  padding: 0;
}
.icon-btn-sq.primary {
  background: var(--accent);
  color: #171717;
  border-color: var(--accent);
  font-weight: 600;
}

.toolbar { margin-bottom: 12px; }
.search, .form-grid input, .form-grid textarea, .form-grid select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel2);
  color: var(--text);
  padding: 11px 12px;
}
.form-panel {
  display: none;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.form-panel.open {
  display: block;
}
.form-panel h3 { margin: 0 0 12px; font-size: 15px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid .full { grid-column: 1 / -1; }
.field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.form-actions { display: flex; gap: 8px; margin-top: 12px; }
.primary-btn {
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  background: var(--accent);
  color: #171717;
  font-weight: 600;
}
.ghost-btn {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  background: transparent;
  color: var(--text);
}

.entry {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.entry-title { font-size: 14px; }
.entry-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.entry-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 32px;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel2);
  color: var(--muted);
  display: grid;
  place-items: center;
}

.words-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.word-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel2);
  font-size: 13px;
}
.word-chip button {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 16px;
  padding: 0;
}
.goal-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: transparent;
  padding: 0;
}
.goal-dot.on {
  background: #c45b52;
  border-color: #e08a82;
}
.word-chip.goal {
  border-color: rgba(196, 91, 82, 0.5);
  background: rgba(196, 91, 82, 0.12);
}
.word-chip.goal span { color: #f0b4ae; }

.bulk-box {
  width: 100%;
  margin-top: 4px;
  margin-bottom: 14px;
}
.bulk-box textarea {
  display: block;
  width: 100%;
  min-height: 110px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel2);
  color: var(--text);
  padding: 12px;
  line-height: 1.4;
}
.bulk-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.words-cloud {
  width: 100%;
}
body.light .bulk-box textarea {
  background: #fff;
  color: #171717;
  border-color: #e2e2dc;
}

.fin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fin-card {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: var(--radius);
  padding: 14px;
}
.fin-card h3 {
  margin: 0 0 10px;
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--muted);
}
.fin-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid #222;
  font-size: 12px;
}
.fin-item:last-child { border-bottom: 0; }
.mzbox-launch {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 12px;
  padding: 10px 16px;
  border: 1px solid #403d31;
  border-radius: 10px;
  background: #1b1a16;
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 1px;
}
.mzbox-launch strong { color: var(--accent); font-size: 12px; }
.mzbox-launch span, .mzbox-launch .arrow { display: none !important; }

.tension-track, .tension-bar {
  height: 10px;
  background: #1c1c1c;
  border-radius: 99px;
  overflow: hidden;
  margin-top: 8px;
  position: relative;
}
.tension-fill { height: 100%; border-radius: 99px; background: var(--accent); min-width: 0; transition: width .25s ease; }
.tension-value { font-size: 18px; font-weight: 550; margin-top: 8px; }
.tension-scale {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
  margin-top: 6px;
}
body.light .tension-track, body.light .tension-bar { background: #e8e8e2; }


.empty {
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  color: var(--muted);
}
.empty-inline { color: var(--muted); font-size: 12px; padding: 12px 0; }

footer {
  margin-top: 40px;
  padding: 24px 0 10px;
  border-top: 1px solid var(--line);
  text-align: center;
  color: var(--muted);
}
.footer-brand {
  font-size: 13px;
  color: var(--text);
  letter-spacing: 2px;
  font-weight: 600;
  margin-bottom: 8px;
}
.footer-brand .copy { color: var(--muted); margin-right: 6px; letter-spacing: 0; }
.author { font-size: 11px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%) translateY(16px);
  background: #1a1a1a;
  color: var(--text);
  border: 1px solid var(--line);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: .2s;
  z-index: 100000;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }

.mzbox-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  background: #000000;
}
.mzbox-overlay.hidden { display: none !important; }
.mzbox-overlay-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: #111;
}
.mzbox-overlay-title { font-weight: 650; color: var(--accent); letter-spacing: 1px; }
.mzbox-overlay-close {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--text);
  font-size: 18px;
}
.mzbox-frame {
  flex: 1;
  width: 100%;
  border: 0;
  background: #000000;
  min-height: 0;
}
body.mzbox-open { overflow: hidden; }

/* Light theme: page stays dark-ish cards become light with dark text */
body.light {
  --bg: #000000;
  --panel: #f4f4f1;
  --panel2: #ffffff;
  --line: #d8d8d2;
  --text: #171717;
  --muted: #6a6a64;
  --accent: #6b6548;
  --green: #2f6b4f;
  --red: #a85a52;
}
body.light {
  background: #000000;
  color: #ecece6;
}
body.light .logo,
body.light .section-top h1,
body.light .footer-brand { color: #ecece6; }
body.light .section-label,
body.light .author,
body.light .brief-top span { color: #9a9a92; }
body.light .welcome-strip,
body.light .briefing,
body.light .nav-card,
body.light .metric,
body.light .brief-date,
body.light .entry,
body.light .fin-card,
body.light .smart-finance,
body.light .form-panel,
body.light .word-chip,
body.light .fin-pulse .cell {
  background: #ffffff;
  color: #171717;
  border-color: #e2e2dc;
}
body.light .nav-card .name,
body.light .nav-card .count,
body.light .metric strong,
body.light .entry-title,
body.light .welcome-left strong,
body.light .brief-date span:first-child,
body.light .form-panel h3,
body.light .smart-row strong,
body.light .fin-pulse .cell b {
  color: #171717;
}
body.light .nav-card .num,
body.light .metric span,
body.light .metric small,
body.light .entry-sub,
body.light .welcome-left span,
body.light .welcome-quote,
body.light .smart-row span,
body.light .fin-pulse .cell span,
body.light .field label,
body.light .fin-card h3 {
  color: #6a6a64;
}
body.light .search,
body.light input,
body.light textarea,
body.light select {
  background: #fff;
  color: #171717;
  border-color: #e2e2dc;
}
body.light .small-btn {
  background: #1a1a1a;
  color: #ecece6;
  border-color: #333;
}
body.light .icon-btn-sq {
  background: #1a1a1a;
  color: #ecece6;
  border-color: #333;
}
body.light .icon-btn-sq.primary {
  background: #d9d3bd;
  color: #171717;
  border-color: #d9d3bd;
}
body.light .primary-btn {
  background: #171717;
  color: #fff;
}
body.light .ghost-btn {
  background: #fff;
  color: #171717;
  border-color: #e2e2dc;
}
body.light .mzbox-launch {
  background: #171717;
  border-color: #333;
}
body.light .mzbox-launch strong { color: #d9d3bd; }
body.light .smart-finance,
body.light .fin-pulse .cell { background: #fafaf8; }
body.light .smart-row { border-color: #ecece6; }
body.light .fin-item { border-color: #ecece6; color: #171717; }
body.light .brief-date span:last-child { color: #a85a52; }

@media (max-width: 900px) {
  .dashboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .finance-overview { grid-template-columns: 1fr 1fr; }
  .fin-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .finance-overview,
  .brief-dates,
  .form-grid,
  .fin-pulse { grid-template-columns: 1fr; }
  .welcome-strip { flex-direction: column; }
  .welcome-quote { max-width: 100%; text-align: left; }
}

.finance-block {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.finance-block-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 10px;
}
.fin-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.fin-metric span {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 4px;
}
.fin-metric strong {
  font-size: 15px;
  font-weight: 550;
}
@media (max-width: 560px) {
  .fin-metrics { grid-template-columns: 1fr; }
}


#entries { width: 100%; }
.toolbar { width: 100%; }
.toolbar .search { width: 100%; max-width: 100%; }

.entry.due-soon, .brief-date.due-soon {
  border-color: rgba(200, 90, 85, 0.45) !important;
  background: rgba(200, 90, 85, 0.10) !important;
  box-shadow: 0 0 0 1px rgba(200, 90, 85, 0.12), 0 0 18px rgba(200, 90, 85, 0.08);
}
.entry.due-soon .entry-title,
.brief-date.due-soon span:first-child {
  color: #c45b52 !important;
}
body.light .entry.due-soon,
body.light .brief-date.due-soon {
  background: rgba(200, 90, 85, 0.08) !important;
  border-color: rgba(200, 90, 85, 0.35) !important;
}
.month-salary-card input {
  width: 100%;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel2);
  color: var(--text);
  padding: 11px 12px;
}
.month-salary-card .row-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.fin-rec {
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel2);
  font-size: 13px;
  line-height: 1.45;
  color: var(--text);
}
.fin-rec b { color: var(--accent); }
body.light .fin-rec b { color: #5c5640; }


.dashboard { gap: 14px !important; }
.finance-overview, .brief-dates { gap: 10px !important; }
.fin-grid { gap: 14px !important; }
.fin-metrics { gap: 12px !important; margin-bottom: 12px; }
.fin-card { margin-bottom: 14px; }
.fin-card + .fin-card { margin-top: 0; }
.metric { padding: 14px !important; }
.entry { margin-bottom: 10px; }
.nav-card { min-height: 128px; }
.section-label-center { margin: 28px 0 16px !important; }
.archive-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.archive-item {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel2);
}
.archive-item strong { display: block; font-size: 14px; margin-bottom: 4px; }
.archive-item span { font-size: 11px; color: var(--muted); line-height: 1.4; }
.archive-item .arch-actions { display: flex; gap: 6px; flex-shrink: 0; }


/* blocks always readable */
.nav-card {
  display: flex !important;
  visibility: visible !important;
  opacity: 1 !important;
  background: var(--panel2) !important;
  color: var(--text) !important;
  border: 1px solid var(--line) !important;
}
.nav-card .name,
.nav-card .count { color: var(--text) !important; }
.nav-card .num { color: var(--muted) !important; }
body.light .nav-card {
  background: #ffffff !important;
  color: #171717 !important;
  border-color: #e2e2dc !important;
}
body.light .nav-card .name,
body.light .nav-card .count { color: #171717 !important; }
body.light .nav-card .num { color: #6a6a64 !important; }
#dashboard {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
@media (min-width: 900px) {
  #dashboard { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}


.fin-chart-wrap {
  margin-top: 12px;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel2);
}
.fin-chart-wrap canvas {
  width: 100%;
  height: 180px;
  display: block;
}
.fin-chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  margin-top: 10px;
  font-size: 11px;
  color: var(--muted);
}
.fin-chart-legend i {
  display: inline-block;
  width: 10px;

function sectionLabel(key) {
  if (key === "COCOS") return "COCOS";
  if (key === "DEBTWISE") return "DEBTWISE";
  return key;

const DEFAULT_EXPENSE_CATS = ["БАЗА", "ТРАНСПОРТ", "ЛИЧНОЕ", "СЕМЬЯ", "КАПИТАЛ"];
const EXPENSE_CATS_KEY = "injectum_expense_cats";

function getExpenseCategories() {
  try {
    const raw = JSON.parse(localStorage.getItem(EXPENSE_CATS_KEY) || "null");
    if (Array.isArray(raw) && raw.length) {
      return raw.map(x => String(x).trim().toUpperCase()).filter(Boolean);
    }
  } catch (_) {}
  return DEFAULT_EXPENSE_CATS.slice();
}

function saveExpenseCategories(list) {
  const clean = (list || []).map(x => String(x).trim().toUpperCase()).filter(Boolean);
  const uniq = [];
  clean.forEach(c => { if (!uniq.includes(c)) uniq.push(c); });
  if (!uniq.length) uniq.push("БАЗА");
  try { localStorage.setItem(EXPENSE_CATS_KEY, JSON.stringify(uniq)); } catch (_) {}
  return uniq;
}

function addExpenseCategory(name) {
  const n = String(name || "").trim().toUpperCase();
  if (!n) return getExpenseCategories();
  const list = getExpenseCategories();
  if (!list.includes(n)) list.push(n);
  return saveExpenseCategories(list);
}

function removeExpenseCategory(name) {
  const n = String(name || "").trim().toUpperCase();
  let list = getExpenseCategories().filter(c => c !== n);
  if (!list.length) list = ["БАЗА"];
  // remap expenses using removed category to БАЗА or first
  const fallback = list[0];
  (data.FINANCES || []).forEach(x => {
    if (x && x.kind === "Расход" && String(x.expenseCategory || "").toUpperCase() === n) {
      x.expenseCategory = fallback;
    }
  });
  try { saveData(); } catch (_) {}
  return saveExpenseCategories(list);

      // migrate old key
      if (!result.COCOS.length && Array.isArray(parsed.PLAN_COCOSA)) {
        result.COCOS = parsed.PLAN_COCOSA;

      if (!Array.isArray(result.DEBTWISE)) result.DEBTWISE = [];

          Object.keys(result).forEach(key => {
            if (Array.isArray(old[key])) {
              if (key === "FINANCES") {

              } else {
                result[key] = old[key];
              }
            }
          });
        }
      } catch (_) {}
    }
    // Merge legacy PLANS into NOTES (date => plan)
    if (Array.isArray(result.PLANS) && result.PLANS.length) {
      const existing = new Set((result.NOTES || []).map(x => x.id));
      result.PLANS.forEach(p => {
        if (!p || existing.has(p.id)) return;
        result.NOTES.push({
          id: p.id || idSafe(),

          status: p.status || "В планах",

      });
      result.PLANS = [];
    }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(result)); } catch (_) {}
    return result;
  } catch (e) {
    return emptyData();
  }

function estimateDepositInterest(item) {
  const amount = Number(item.amount) || 0;
  const rate = Number(item.rate) || 0;
  if (item.frequency === "Ежедневно") return amount * rate / 100 / 365;
  return amount * rate / 100 / 12;
}

function depositDaily(item) {
  const amount = Number(item.amount) || 0;
  const rate = Number(item.rate) || 0;
  if (!(amount > 0) || !(rate > 0)) return 0;
  return amount * rate / 100 / 365;
}

function depositStartDate(item) {
  const raw = item.startDate || (item.createdAt ? String(item.createdAt).slice(0, 10) : "");
  const d = parseDate(raw);
  if (d) return d;
  const t = item.createdAt ? new Date(item.createdAt) : new Date();
  t.setHours(0, 0, 0, 0);
  return t;
}

function depositAccrued(item) {
  const daily = depositDaily(item);
  if (!(daily > 0)) return 0;
  const start = depositStartDate(item);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = Math.max(0, Math.round((today - start) / 86400000));
  return daily * days;
}

function depositEffectiveAmount(item) {
  return (Number(item.amount) || 0) + depositAccrued(item);
}

function autoTensionFromMzbox() {

  // +10% к портфелю → 0% напряжённости; -10% → 100%; 0% → 50%
  const pct = (mz.pnl / mz.cost) * 100;
  const t = (10 - pct) * 5;
  return Math.max(0, Math.min(100, t));
}

}

/* ---- MZBOX summary bridge ---- */
function readMzboxSummary() {
  try {
    const raw = localStorage.getItem("mzbox-portfolio-cache");
    if (!raw) return null;
    const cache = JSON.parse(raw);
    if (!cache || !Array.isArray(cache.portfolioRows)) return null;
    const rows = cache.portfolioRows.filter(r => Number(r.qty) > 0);
    if (!rows.length) return null;
    let market = 0;
    let pnl = 0;
    rows.forEach(r => {
      market += Number(r.value) || (Number(r.price) || 0) * (Number(r.qty) || 0);
      pnl += Number(r.pnl) || 0;
    });
    const cost = market - pnl;
    return {
      market,
      cost,
      pnl,
      at: Number(cache.at) || 0,
      rows: rows.length
    };
  } catch (_) {
    return null;
  }
}

function daysUntilDate(value) {
  const d = parseDate(value);
  if (!d) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.round((d - today) / 86400000);
}
function isDueSoon(value, withinDays = 10, item = null) {
  // Красный только: за 10 дней до даты, или после даты если уже попадали в окно (seenYear)
  let n = daysUntilDate(value);
  if (item && (item.month && item.day)) {
    const occ = thisYearOccurrence(item, new Date());
    if (occ) {
      const t = new Date();
      t.setHours(0, 0, 0, 0);
      n = Math.round((occ - t) / 86400000);
    }
  }
  if (n === null) return false;
  if (n > withinDays) return false;
  if (n >= 0 && n <= withinDays) return true;
  // просрочка — только если событие уже «открывалось» в этом году
  if (n < 0 && item && Number(item.seenYear) === new Date().getFullYear()) return true;
  return false;
}

      return s + (Number(x.amount) || 0) * (Number(x.rate) || 0) / 100 / 12;
    return s + daily * daysInMonth;
  }, 0);

  try {

function padDate(year, month, day) {
  return year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
}

function eventParts(ev) {
  if (!ev) return null;
  if (ev.month && ev.day) return { month: Number(ev.month), day: Number(ev.day) };
  const d = parseDate(ev.date);
  if (!d) return null;
  return { month: d.getMonth() + 1, day: d.getDate() };
}

function occurrenceDate(ev, year) {
  const p = eventParts(ev);
  if (!p) return null;
  const d = new Date(year, p.month - 1, p.day);
  d.setHours(0, 0, 0, 0);
  return d;
}

function thisYearOccurrence(ev, today) {
  const y = today.getFullYear();
  const p = eventParts(ev);
  if (!p) {
    const d = parseDate(ev.date);
    if (!d) return null;
    d.setHours(0, 0, 0, 0);
    return d;
  }
  return occurrenceDate(ev, y);
}

function shouldShowDeadline(ev, today) {
  today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const occ = thisYearOccurrence(ev, today);
  if (!occ) return false;
  const y = today.getFullYear();
  if (Number(ev.doneForYear) === y) return false;
  const diff = Math.round((occ - today) / 86400000);
  // ещё рано (больше чем за 10 дней)
  if (diff > 10) return false;
  // в окне до даты (0..10) — показать и запомнить, что окно открывалось
  if (diff >= 0 && diff <= 10) {
    if (ev.seenYear !== y) {
      ev.seenYear = y;
      try { saveData(); } catch (_) {}
    }
    return true;
  }
  // после даты: только если уже попадали в 10-дневное окно и не отметили
  // первый раз для уже прошедшей даты — не показывать
  if (diff < 0) {
    return Number(ev.seenYear) === y;
  }
  return false;
}

  } else {

  }

  saveData();
}

  });
  return sortWordList(list);
}

function seedDefaultEventsIfNeeded() {
  try {
    (data.EVENTS || []).forEach(function (e) {
      if (e && e.title === "МАРИЯ" && e.eventType === "ДР" && Number(e.birthYear) === 1981) {
        e.birthYear = 1979;
      }
      if (e && e.title === "ЮЛИЯ" && e.eventType === "ДР" && (Number(e.birthYear) === 1986 || Number(e.birthYear) === 1979)) {
        e.birthYear = 1981;
      }
    });
  } catch (_) {}

  try {
    if (!Array.isArray(data.EVENTS)) data.EVENTS = [];
    data.EVENTS.forEach(e => {
      if ((!e.month || !e.day) && e.date) {
        const d = parseDate(e.date);
        if (d) {
          e.month = d.getMonth() + 1;
          e.day = d.getDate();
          if (e.recurring == null) e.recurring = true;
        }
      }
      if (e.doneForYear === undefined) e.doneForYear = null;
    });
    const defaults = getDefaultEvents();
    const keyOf = (e) =>
      [String(e.title || "").trim(), String(e.eventType || "").trim(), Number(e.month) || 0, Number(e.day) || 0].join("|");
    const have = new Set(data.EVENTS.map(keyOf));
    let added = 0;
    defaults.forEach(d => {
      const k = keyOf(d);
      if (!have.has(k)) {
        data.EVENTS.push(d);
        have.add(k);
        added++;
      }
    });
    if (!localStorage.getItem("injectum_events_seed_v3") && data.EVENTS.length < defaults.length) {
      if (data.EVENTS.length <= 3) {
        data.EVENTS = defaults;
        added = defaults.length;
      }
    }
    localStorage.setItem("injectum_events_seed_v3", "1");
    if (added > 0) saveData();
  } catch (err) {
    console.error(err);
  }
}

function renderBriefing() {
  const now = new Date();
  const briefToday = document.getElementById("briefToday");
  if (briefToday) {
    briefToday.textContent = new Intl.DateTimeFormat("ru-RU", {
      day: "numeric", month: "long", year: "numeric"
    }).format(now);
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const upcoming = [];

  data.EVENTS.forEach(x => {
    if (!shouldShowDeadline(x, today)) return;
    const occ = thisYearOccurrence(x, today);
    if (!occ) return;
    const t = x.eventType === "Другое" ? (x.eventTypeCustom || "") : (x.eventType || "");
    let title = t ? (t + " · " + x.title) : x.title;
    if ((x.eventType === "ДР" || t === "ДР") && x.birthYear) {
      const age = birthdayAgeText(x, today);
      if (age) title += " · " + age;
    }
    const dateStr = padDate(occ.getFullYear(), occ.getMonth() + 1, occ.getDate());
    upcoming.push({ kind: "event", id: x.id, title, date: dateStr, section: "EVENTS" });
  });
  data.NOTES.forEach(x => {
    if (!x.date) return;
    const y = today.getFullYear();
    if (Number(x.doneForYear) === y) return;
    const d = parseDate(x.date);
    if (!d) return;
    d.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 86400000);
    if (diff > 10) return;
    if (diff >= 0 && diff <= 10) {
      if (x.seenYear !== y) {
        x.seenYear = y;
        try { saveData(); } catch (_) {}
      }
      upcoming.push({ kind: "note", id: x.id, title: x.title, date: x.date, section: "NOTES" });
      return;
    }
    if (diff < 0 && Number(x.seenYear) === y) {
      upcoming.push({ kind: "note", id: x.id, title: x.title, date: x.date, section: "NOTES" });
    }
  });
  (data.COCOS || []).forEach(x => {
    if (!x.date || x.done) return;
    const d = parseDate(x.date);
    if (!d) return;
    d.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 86400000);
    if (diff > 10 || diff < -3) return;
    const title = (x.scope ? ("COCOS · " + x.scope + " · ") : "COCOS · ") + (x.title || "");
    upcoming.push({ kind: "coco", id: x.id, title: title, date: x.date, section: "COCOS" });
  });
  upcoming.sort((a, b) => String(a.date).localeCompare(String(b.date)));

  const dates = document.getElementById("briefDates");
  if (dates) {
    dates.innerHTML = "";
    if (!upcoming.length) {
      dates.innerHTML = '<div class="empty-inline">Ближайших событий и дедлайнов нет</div>';
    } else {
      const grid = document.createElement("div");
      grid.className = "brief-dates";
      upcoming.slice(0, 12).forEach(x => {
        const row = document.createElement("div");
        const src = (x.section === "EVENTS")
          ? data.EVENTS.find(e => e.id === x.id)
          : data.NOTES.find(e => e.id === x.id);
        const soon = isDueSoon(x.date, 10, src || null);
        row.className = "brief-date" + (soon ? " due-soon" : "");
        const check = document.createElement("button");
        check.type = "button";
        check.className = "brief-check";
        check.title = "Отметить";
        check.textContent = "✓";
        check.addEventListener("click", e => {
          e.stopPropagation();
          if (x.section === "COCOS") {
            const list = data.COCOS || [];
            const item = list.find(it => it.id === x.id);
            if (item) { item.done = true; saveData(); }
          } else {
            toggleDoneById(x.id, x.section);
          }
          renderBriefing();
          showToast("Готово");
        });
        const title = document.createElement("span");
        title.textContent = x.title;
        title.style.flex = "1";
        title.style.minWidth = "0";
        const date = document.createElement("span");
        date.textContent = formatDate(x.date);
        row.append(check, title, date);
        grid.appendChild(row);
      });
      dates.appendChild(grid);
    }
  }

  // Income: salary + passive + deposit daily * daysInMonth
  const passive = sumFinance("Пассивный доход");
  const salaryEntries = sumFinance("Зарплата");
  const monthSal = getMonthSalary(currentMonthKey());
  const salary = monthSal != null ? monthSal : salaryEntries;
  const deposits = getFinance("Вклад");
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const depositMonth = deposits.reduce((s, x) => {
    const daily = depositDaily(x);
    if (!daily) return s;
    const freq = x.frequency || "Ежедневно";
    if (freq === "Ежемесячно") return s + (Number(x.amount) || 0) * (Number(x.rate) || 0) / 100 / 12;
    return s + daily * daysInMonth;
  }, 0);
  const income = passive + salary + depositMonth;
  const permanent = sumPermanentExpenses();
  const temporary = sumTemporaryExpenses();
  const expenses = permanent + temporary;
  const balance = income - expenses;

  const elInc = document.getElementById("totalIncome");
  const elExp = document.getElementById("totalExpenses");
  const elBal = document.getElementById("balance");
  if (elInc) elInc.textContent = formatMoney(income);
  if (elExp) elExp.textContent = formatMoney(expenses);
  if (elBal) {
    elBal.textContent = formatMoney(balance);
    elBal.className = balance >= 0 ? "positive" : "negative";
  }

  // hide legacy metric nodes if present
  ["passiveTotal", "salaryTotal", "depositTotalBrief"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = "";
  });

  // Tension
  const autoT = autoTensionFromMzbox();
  if (autoT != null) {
    tensionValue = autoT;
    try { localStorage.setItem(TENSION_KEY, String(tensionValue)); } catch (_) {}
  }
  const tFill = document.getElementById("briefTensionFill");
  const tLabel = document.getElementById("briefTensionLabel");
  if (tFill) {
    tFill.style.width = tensionValue + "%";
    tFill.style.background = tensionColor(tensionValue);
  }
  if (tLabel) tLabel.textContent = Math.round(tensionValue) + "%";
}

function createField(field, value = "") {
  const wrap = document.createElement("div");
  const forceFull = field.full || field.type === "date" || field.type === "textarea";
  wrap.className = "field" + (forceFull ? " full" : "");
  const label = document.createElement("label");
  label.textContent = field.label;
  label.htmlFor = "field_" + field.name;
  wrap.appendChild(label);
  let input;
  if (field.type === "select") {
    input = document.createElement("select");
    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = "Выбрать";
    input.appendChild(empty);
    field.options.forEach(v => {
      const option = document.createElement("option");
      option.value = v;
      option.textContent = v;
      input.appendChild(option);
    });
  } else if (field.type === "textarea") {
    input = document.createElement("textarea");
    input.rows = 3;
  } else {
    input = document.createElement("input");
    input.type = field.type;
    if (field.type === "number") {
      input.min = "0";
      input.step = "any";
    }
  }
  input.id = "field_" + field.name;
  input.name = field.name;
  input.value = value ?? "";
  if (field.required) input.required = true;
  wrap.appendChild(input);
  return wrap;
}

function birthdayAgeText(item, today) {
  today = today || new Date();
  if (!item || !item.birthYear) return "";
  const by = Number(item.birthYear);
  if (!by) return "";
  const p = eventParts(item);
  if (!p) return "";
  const y = today.getFullYear();
  const occ = new Date(y, p.month - 1, p.day);
  occ.setHours(0, 0, 0, 0);
  const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let ageNow = y - by;
  if (t < occ) ageNow -= 1;
  if (ageNow < 0) return "";
  if (t < occ) return "сейчас " + ageNow + " · исполнится " + (ageNow + 1);
  if (t.getTime() === occ.getTime()) return "исполняется " + (y - by);
  return "сейчас " + ageNow;
}

function getSub(item) {
  if (!item) return "";
  if (currentSection === "NOTES") {
    if (item.date) return "План · " + formatDate(item.date);
    return "Заметка";
  }
  if (currentSection === "PLANS") {
    return [formatDate(item.date), item.status || "В планах"].filter(Boolean).join(" · ");
  }
  if (currentSection === "EVENTS") {
    const t = item.eventType === "Другое" ? (item.eventTypeCustom || "Другое") : (item.eventType || "");
    const p = eventParts(item);
    const ds = p
      ? String(p.day).padStart(2, "0") + "." + String(p.month).padStart(2, "0")
      : formatDate(item.date);
    let age = "";
    if ((item.eventType === "ДР" || t === "ДР") && item.birthYear) {
      age = birthdayAgeText(item);
    }
    return [t, ds, age].filter(Boolean).join(" · ");
  }
  if (currentSection === "ASSETS") return "";
  if (currentSection === "REFLECTION") return "";
  if (currentSection === "COCOS") {
    const parts = [];
    if (item.scope) parts.push(item.scope);
    if (item.date) parts.push(formatDate(item.date));
    if (item.done) parts.push("сделано");
    return parts.join(" · ");
  }
  if (currentSection === "FINANCES") {
    let text = (item.kind || "") + " · " + formatMoney(item.amount);
    if (item.kind === "Расход") {
      if (item.expenseCategory) text += " · " + item.expenseCategory;
      text += isTemporaryExpense(item) ? " · временный" : " · постоянный";
      if (item.source) text += " · " + item.source;
    }
    if (item.kind === "Вклад") {
      text += " · " + (item.rate || 0) + "%";
      const daily = depositDaily(item);
      if (daily > 0) text += " · +" + formatMoney(daily) + "/день";
    }
    return text;
  }
  return "";
}

function saveEntry(event) {
  if (event) event.preventDefault();
  if (!currentSection) return;

  const formEl = document.getElementById("entryForm");
  if (!formEl) return;
  const form = new FormData(formEl);
  const entry = {
    id: editingId || id(),
    updatedAt: new Date().toISOString()
  };

  if (currentSection === "FINANCES") {
    entry.kind = String(form.get("kind") || "");
    entry.title = String(form.get("title") || "").trim();
    entry.amount = Number(form.get("amount")) || 0;
    if (!entry.title) {
      showToast("Введите название");
      return;
    }
    if (entry.kind === "Расход") {
      entry.source = String(form.get("source") || "").trim();
      entry.expenseCategory = String(form.get("expenseCategory") || "БАЗА").trim() || "БАЗА";
      const mode = String(form.get("expenseMode") || "Постоянный");
      entry.expenseMode = mode;
      entry.temporary = mode === "Временный";
    }
    if (entry.kind === "Вклад") {
      entry.rate = Number(form.get("rate")) || 0;
      entry.frequency = String(form.get("frequency") || "Ежедневно");
      entry.startDate = String(form.get("startDate") || "").trim();
    }
  } else if (currentSection === "ASSETS" && !editingId) {
    const bulk = String(form.get("bulk") || "").trim();
    if (!bulk) {
      showToast("Введите слова");
      return;
    }
    const n = addBulkWords("ASSETS", bulk);
    saveData();
    closeForm();
    showToast(n ? ("Добавлено: " + n) : "Нечего добавлять");
    renderEntries();
    return;
  } else {
    const sec = sections[currentSection];
    if (!sec) return;
    sec.fields.forEach(function (f) {
      entry[f.name] = String(form.get(f.name) || "").trim();
    });
    if (currentSection === "EVENTS") {
      if (entry.eventType !== "Другое") entry.eventTypeCustom = "";
      if (entry.eventType === "Другое" && !entry.eventTypeCustom) {
        showToast("Укажите свой тип");
        return;
      }
      const d = parseDate(entry.date);
      if (d) {
        entry.month = d.getMonth() + 1;
        entry.day = d.getDate();
        entry.recurring = true;
      }
      if (entry.doneForYear === undefined) entry.doneForYear = null;
    }
    if (currentSection === "ASSETS") {
      if (!entry.title) {
        showToast("Введите слово");
        return;
      }
    }
  }

  if (!Array.isArray(data[currentSection])) data[currentSection] = [];

  if (editingId) {
    const index = data[currentSection].findIndex(function (x) { return x.id === editingId; });
    if (index >= 0) {
      entry.createdAt = data[currentSection][index].createdAt || entry.updatedAt;
      // keep goal / done flags
      if (data[currentSection][index].goal != null) entry.goal = data[currentSection][index].goal;
      if (data[currentSection][index].doneForYear != null) entry.doneForYear = data[currentSection][index].doneForYear;
      if (data[currentSection][index].seenYear != null) entry.seenYear = data[currentSection][index].seenYear;
      if (data[currentSection][index].birthYear != null && entry.birthYear == null) {
        entry.birthYear = data[currentSection][index].birthYear;
      }
      data[currentSection][index] = entry;
    } else {
      entry.createdAt = entry.updatedAt;
      data[currentSection].push(entry);
    }
  } else {
    entry.createdAt = entry.updatedAt;
    data[currentSection].push(entry);
  }

  if (currentSection === "ASSETS") {
    data.ASSETS = sortWordList(data.ASSETS);
  }

  saveData();
  closeForm();
  if (currentSection === "FINANCES") renderFinancesView();
  else renderEntries();
  showToast("Сохранено");
}


function sortWordList(list) {
  return [...list].sort(
    (a, b) =>
      (b.title || "").length - (a.title || "").length ||
      (a.title || "").localeCompare(b.title || "", "ru")
  );
}

/** Pack words into rows by estimated character budget (long + short fill). */
function packWordsIntoRows(list, rowBudget = 22) {
  // Conservative budget; CSS wrap is the real safety net
  const items = [...list].sort(
    (a, b) => (b.title || "").length - (a.title || "").length ||
      (a.title || "").localeCompare(b.title || "", "ru")
  );
  const rows = [];
  const used = new Set();
  while (used.size < items.length) {
    let remaining = rowBudget;
    const row = [];
    for (const it of items) {
      if (used.has(it.id)) continue;
      const len = Math.min(18, Math.max(1, (it.title || "").length));
      if (row.length === 0 || len + 1 <= remaining) {
        row.push(it);
        used.add(it.id);
        remaining -= len + 1;
      }
      if (remaining <= 3) break;
    }
    if (!row.length) {
      for (const it of items) {
        if (used.has(it.id)) continue;
        row.push(it);
        used.add(it.id);
        break;
      }
    }
    if (row.length) rows.push(row);
    else break;
  }
  return rows;
}

function parseBulkWords(text) {
  return String(text || "")
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);
}

function addBulkWords(sectionKey, text) {
  const words = parseBulkWords(text);
  if (!words.length) {
    showToast("Нет слов для добавления");
    return 0;
  }
  const existing = new Set(
    (data[sectionKey] || []).map(x => String(x.title || "").trim().toLowerCase())
  );
  let added = 0;
  words.forEach(w => {
    const key = w.toLowerCase();
    if (existing.has(key)) return;
    existing.add(key);
    data[sectionKey].push({
      id: id(),
      title: w,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
    added++;
  });
  // keep longest -> shortest
  data[sectionKey] = sortWordList(data[sectionKey]);
  saveData();
  return added;
}

function drawFinanceChart(canvas, parts) {
  if (!canvas) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(canvas.clientWidth || 320, 280);
  const h = 220;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const text = (getComputedStyle(document.body).getPropertyValue("--text") || "#f2f2ef").trim();
  const muted = (getComputedStyle(document.body).getPropertyValue("--muted") || "#8a8a82").trim();
  const line = (getComputedStyle(document.body).getPropertyValue("--line") || "#2a2a2a").trim();
  const total = parts.reduce((s, p) => s + Math.max(0, Number(p.value) || 0), 0);

  // soft panel
  ctx.fillStyle = "rgba(255,255,255,0.02)";
  ctx.beginPath();
  ctx.roundRect?.(0, 0, w, h, 12) || ctx.rect(0, 0, w, h);
  ctx.fill();

  const cx = w * 0.32;
  const cy = h * 0.52;
  const r = Math.min(w, h) * 0.30;
  const r0 = r * 0.62;

  if (total <= 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, (r + r0) / 2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(140,140,130,.2)";
    ctx.lineWidth = r - r0;
    ctx.stroke();
    ctx.fillStyle = muted;
    ctx.font = "12px -apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Нет данных", cx, cy + 4);
  } else {
    // track ring
    ctx.beginPath();
    ctx.arc(cx, cy, (r + r0) / 2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(140,140,130,.12)";
    ctx.lineWidth = r - r0;
    ctx.stroke();

    let a = -Math.PI / 2;
    parts.forEach(p => {
      const v = Math.max(0, Number(p.value) || 0);
      if (!v) return;
      const slice = (v / total) * Math.PI * 2;
      // gap
      const gap = 0.04;
      const a0 = a + gap / 2;
      const a1 = a + slice - gap / 2;
      if (a1 > a0) {
        ctx.beginPath();
        ctx.arc(cx, cy, (r + r0) / 2, a0, a1);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = r - r0;
        ctx.lineCap = "round";
        ctx.stroke();
      }
      a += slice;
    });

    ctx.fillStyle = text;
    ctx.font = "600 12px -apple-system,sans-serif";
    ctx.textAlign = "center";
    const expSum = parts.filter(p => p.label !== "ДОХОД").reduce((s, p) => s + (Number(p.value) || 0), 0);
    const inc = parts.find(p => p.label === "ДОХОД");
    ctx.fillText(inc ? "доход" : "расход", cx, cy - 6);
    ctx.fillStyle = muted;
    ctx.font = "11px -apple-system,sans-serif";
    ctx.fillText(inc ? formatMoney(inc.value) : formatMoney(expSum), cx, cy + 12);
  }

  // legend list
  let y = 28;
  parts.forEach(p => {
    const val = Math.max(0, Number(p.value) || 0);
    const pct = total > 0 ? Math.round((val / total) * 100) : 0;
    // bar
    const bx = w * 0.58;
    const bw = w * 0.34;
    ctx.fillStyle = "rgba(140,140,130,.12)";
    ctx.fillRect(bx, y + 12, bw, 4);
    ctx.fillStyle = p.color;
    ctx.fillRect(bx, y + 12, bw * (pct / 100), 4);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(bx - 10, y + 6, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = muted;
    ctx.font = "11px -apple-system,sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(p.label, bx, y + 6);
    ctx.fillStyle = text;
    ctx.font = "600 11px -apple-system,sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(pct + "%", bx + bw, y + 6);
    y += 36;
  });
}

        '<span><i style="background:' + p.color + '"></i>' + p.label + ' · ' + formatMoney(p.value) + '</span>'
      ).join("");
    }
  });

  
  const catList = root.querySelector("#expenseCatList");
  if (catList) {
    catList.innerHTML = "";
    getExpenseCategories().forEach(function (c) {
      const chip = document.createElement("div");
      chip.className = "cat-chip";
      chip.innerHTML = "<span>" + escapeHTML(c) + "</span>";
      const del = document.createElement("button");
      del.type = "button";
      del.textContent = "×";
      del.title = "Удалить раздел";
      del.addEventListener("click", function () {
        if (!confirm("Удалить раздел " + c + "?")) return;
        removeExpenseCategory(c);
        renderFinancesView();
        showToast("Раздел удалён");
      });
      chip.appendChild(del);
      catList.appendChild(chip);
    });
  }
  const addCatBtn = root.querySelector("#addExpenseCatBtn");
  if (addCatBtn) {
    addCatBtn.onclick = function () {
      const inp = root.querySelector("#newExpenseCat");
      const name = inp ? inp.value : "";
      if (!String(name || "").trim()) {
        showToast("Введите название");
        return;
      }
      addExpenseCategory(name);
      if (inp) inp.value = "";
      renderFinancesView();
      showToast("Раздел добавлен");
    };
  }

  const depList = root.querySelector("#finDepositList");

  if (!deposits.length) {
    depList.innerHTML = '<div class="empty-inline">Нет вкладов</div>';
  } else {
    deposits.forEach(x => {
      const daily = depositDaily(x);
      const effective = depositEffectiveAmount(x);
      addLine(depList, (x.title || "") + " · " + (x.rate || 0) + "%", formatMoney(effective) + " · +" + formatMoney(daily) + "/день");
    });
  }

  const allRoot = root.querySelector("#finAllEntries");
  const all = data.FINANCES.slice();
  if (!all.length) {
    allRoot.innerHTML = '<div class="empty">Нет записей</div>';
  } else {
    all.forEach(item => {
      const row = document.createElement("div");
      row.className = "entry";
      let text = (item.kind || "") + " · " + formatMoney(item.amount);
      if (item.kind === "Расход") {
        if (item.expenseCategory) text += " · " + item.expenseCategory;
        text += isTemporaryExpense(item) ? " · временный" : " · постоянный";
        if (item.source) text += " · " + item.source;
      }
      if (item.kind === "Вклад") text += " · " + (item.rate || 0) + "%";
      row.innerHTML =
        '<div><div class="entry-title">' + escapeHTML(item.title || "") + '</div>' +
        '<div class="entry-sub">' + escapeHTML(text) + '</div></div>';
      const actions = document.createElement("div");
      actions.className = "entry-actions";
      const edit = document.createElement("button");
      edit.type = "button";
      edit.className = "icon-btn";
      edit.textContent = "✎";
      edit.title = "Изменить";
      edit.addEventListener("click", () => openForm(item));
      const del = document.createElement("button");
      del.type = "button";
      del.className = "icon-btn";
      del.textContent = "×";
      del.addEventListener("click", () => deleteEntry(item.id));
      actions.append(edit, del);
      row.appendChild(actions);
      allRoot.appendChild(row);
    });
  }

  const btn = root.querySelector("#openMzbox");
  if (btn) btn.addEventListener("click", openMzboxModule);
}

function applyTheme(mode) {
  const m = (mode === "light" || mode === "rose") ? mode : "dark";
  document.body.classList.remove("light", "dark", "rose");
  document.body.classList.add(m);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", m === "light" ? "#f3f3f1" : "#000000");
  const btn = document.getElementById("themeBtn");
  if (btn) {
    if (m === "dark") { btn.textContent = "◐"; btn.title = "Светлая тема"; }
    else if (m === "light") { btn.textContent = "◑"; btn.title = "Розовая тема"; }
    else { btn.textContent = "♡"; btn.title = "Тёмная тема"; }
  }
  try { localStorage.setItem(THEME_KEY, m); } catch (_) {}
}
function toggleTheme() {
  let cur = "dark";
  try { cur = localStorage.getItem(THEME_KEY) || "dark"; } catch (_) {}
  const next = cur === "dark" ? "light" : (cur === "light" ? "rose" : "dark");
  applyTheme(next);
}
try {
  (function(){
  const t = localStorage.getItem(THEME_KEY) || "dark";
  applyTheme(t === "light" || t === "rose" ? t : "dark");
})();
} catch (_) {
  applyTheme("dark");
}


function exportData() {
  // include expense categories in payload via data shadow

  let mzToken = "", mzCache = null, mzWatch = null, mzTheme = "";
  try { mzToken = localStorage.getItem("mzbox-token") || ""; } catch (_) {}
  try { mzCache = JSON.parse(localStorage.getItem("mzbox-portfolio-cache") || "null"); } catch (_) {}
  try { mzWatch = JSON.parse(localStorage.getItem("mzbox-watchlist") || "null"); } catch (_) {}
  try { mzTheme = localStorage.getItem("mzbox-theme") || ""; } catch (_) {}
  const payload = {
    app: "INJECTUM",
    version: 6,
    exportedAt: new Date().toISOString(),
    ...data,
    tension: tensionValue,
    monthSalary: getMonthSalaryMap(),
    monthArchives: getMonthArchives(),
    expenseCategories: getExpenseCategories(),
    mzbox: { token: mzToken, portfolioCache: mzCache, watchlist: mzWatch, theme: mzTheme }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "INJECTUM-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("Резервная копия создана");
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const imported = emptyData();
      Object.keys(imported).forEach(key => {
        if (!Array.isArray(parsed[key])) throw new Error("Неверный формат");
        imported[key] = parsed[key]
          .filter(x => key !== "FINANCES" || (x && x.kind !== "Чужие деньги"))
          .map(x => ({ ...x, id: x.id || id() }));
      });
      if (!confirm("Импорт заменит текущие данные. Продолжить?")) return;
      data = imported;
      if (Number.isFinite(Number(parsed.tension))) {
        tensionValue = Math.max(0, Math.min(100, Number(parsed.tension)));
        try {
          localStorage.setItem(TENSION_KEY, String(tensionValue));
        } catch (_) {}
      }
      if (Array.isArray(parsed.expenseCategories)) {
        try { saveExpenseCategories(parsed.expenseCategories); } catch (_) {}
      }
      if (Array.isArray(parsed.monthArchives)) {
        try { localStorage.setItem("injectum_month_archives", JSON.stringify(parsed.monthArchives)); } catch (_) {}
      }
      if (parsed.monthSalary && typeof parsed.monthSalary === "object") {
        try { localStorage.setItem("injectum_month_salary", JSON.stringify(parsed.monthSalary)); } catch (_) {}
      }
      if (parsed.mzbox && typeof parsed.mzbox === "object") {
        try {
          if (parsed.mzbox.token) localStorage.setItem("mzbox-token", String(parsed.mzbox.token));
          if (parsed.mzbox.portfolioCache) localStorage.setItem("mzbox-portfolio-cache", JSON.stringify(parsed.mzbox.portfolioCache));
          if (parsed.mzbox.watchlist) localStorage.setItem("mzbox-watchlist", JSON.stringify(parsed.mzbox.watchlist));
          if (parsed.mzbox.theme) localStorage.setItem("mzbox-theme", String(parsed.mzbox.theme));
        } catch (_) {}
      }
      saveData();
      if (currentSection) {
        if (currentSection === "FINANCES") renderFinancesView();
        else renderEntries();
      }
      showToast("Данные импортированы");
    } catch (e) {
      alert("Не удалось прочитать резервную копию INJECTUM.");
    }
  };
  reader.readAsText(file);
}

  const i = Math.floor(Math.random()*QUOTE_BANK.length);
  return QUOTE_BANK[i];
}
function updateWelcomePanel(){
  const now = new Date();
  const t = document.getElementById("homeTime");
  const p = document.getElementById("homePlace");
  const q = document.getElementById("homeQuote");
  if (t) t.textContent = new Intl.DateTimeFormat("ru-RU",{hour:"2-digit",minute:"2-digit"}).format(now);
  if (p) {
    const date = new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(now);
    p.textContent = date;
  }
  if (q && (!q.dataset.at || Date.now()-Number(q.dataset.at)>3600000)) {
    const [text,author] = pickQuote();
    q.innerHTML = text + (author ? "<em>— "+author+"</em>" : "");
    q.dataset.at = String(Date.now());
  }
}

}

03c/thead>\n        \u003ctbody id=\"scheduleTable\">\u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cdiv class=\"note\" id=\"scheduleNote\">\u0421\u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044f \u043f\u043e \u0432\u044b\u0431\u0440\u0430\u043d\u043d\u043e\u043c\u0443 \u0441\u0440\u043e\u043a\u0443 \u0438 \u0434\u043e\u043f\u043b\u0430\u0442\u0435.\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\n\"use strict\";\nconst $=id=>document.getElementById(id);\nconst num=id=>{const n=Number($(id).value);return Number.isFinite(n)?n:0};\nconst money=n=>Number.isFinite(n)?Math.round(n).toLocaleString(\"ru-RU\")+\" \u20bd\":\"\u2014\";\nconst pct=n=>Number.isFinite(n)?n.toFixed(1).replace(\".\",\",\")+\"%\":\"\u2014\";\nconst clamp=(n,a,b)=>Math.min(b,Math.max(a,n));\nfunction termText(n){\n  const y=Math.floor(n/12),m=n%12,p=[];\n  if(y)p.push(y+(y===1?\" \u0433\u043e\u0434\":y\u003c5?\" \u0433\u043e\u0434\u0430\":\" \u043b\u0435\u0442\"));\n  if(m)p.push(m+(m===1?\" \u043c\u0435\u0441\":m\u003c5?\" \u043c\u0435\u0441\":\" \u043c\u0435\u0441\"));\n  return p.join(\" \")||\"0 \u043c\u0435\u0441\";\n}\nfunction read(){\n  return{\n    p:Math.max(0,num(\"amount\")),\n    n:clamp(Math.round(num(\"months\")),1,360),\n    rate:clamp(num(\"rate\"),0,300)/1200,\n    method:$(\"method\").value,\n    income:Math.max(0,num(\"income\")),\n    living:Math.max(0,num(\"living\")),\n    other:Math.max(0,num(\"other\")),\n    reserve:clamp(num(\"reserve\"),0,90)/100,\n    extra:Math.max(0,num(\"extra\"))\n  };\n}\nfunction basePayment(p,r,n){\n  if(n\u003c=0||p\u003c=0)return 0;\n  if(r===0)return p/n;\n  const q=Math.pow(1+r,n);\n  return p*r*q/(q-1);\n}\nfunction simulate(x,n,extra){\n  if(x.p\u003c=0||n\u003c1)return null;\n  let balance=x.p,interestTotal=0,principalTotal=0,debtPayments=0;\n  const rows=[];\n  const fixed=basePayment(x.p,x.rate,n);\n  for(let m=1;m\u003c=n&&balance>0.005;m++){\n    const opening=balance;\n    const interest=opening*x.rate;\n    let principal=x.method===\"diff\"?Math.min(opening,x.p/n):Math.min(opening,Math.max(0,fixed-interest));\n    const early=Math.min(Math.max(0,opening-principal),extra||0);\n    principal=Math.min(opening,principal+early);\n    const debtPayment=principal+interest;\n    balance=Math.max(0,opening-principal);\n    if(balance\u003c0.005)balance=0;\n    interestTotal+=interest;principalTotal+=principal;debtPayments+=debtPayment;\n    rows.push({month:m,payment:debtPayment,interest,principal,balance});\n  }\n  return{\n    rows,months:rows.length,interest:interestTotal,principal:principalTotal,\n    debtPayments,total:debtPayments,overpay:debtPayments-x.p,\n    first:rows[0]||null,last:rows[rows.length-1]||null\n  };\n}\nfunction afford(x,result){\n  if(!x.income)return null;\n  const capacity=x.income-x.living-x.other-x.income*x.reserve;\n  const pay=result.first?result.first.payment:0;\n  const burden=(pay+x.other)/x.income*100;\n  return{available:capacity-pay,burden,safe:capacity-pay>=-0.01&&burden\u003c=40};\n}\nfunction scan(x){\n  const arr=[];\n  for(let n=1;n\u003c=360;n++){\n    const r=simulate(x,n,0);\n    if(!r)continue;\n    const a=afford(x,r);\n    arr.push({n,payment:r.first.payment,overpay:r.overpay,safe:a?a.safe:false,result:r});\n  }\n  return arr;\n}\nfunction renderSchedule(result){\n  const body=$(\"scheduleTable\");\n  body.innerHTML=\"\";\n  if(!result)return;\n  const frag=document.createDocumentFragment();\n  result.rows.forEach(row=>{\n    const tr=document.createElement(\"tr\");\n    [row.month,money(row.payment),money(row.interest),money(row.principal),money(row.balance)].forEach(v=>{\n      const td=document.createElement(\"td\");td.textContent=v;tr.appendChild(td);\n    });\n    frag.appendChild(tr);\n  });\n  body.appendChild(frag);\n  $(\"scheduleNote\").textContent=\"\u041c\u0435\u0441\u044f\u0446\u0435\u0432 \u0432 \u0433\u0440\u0430\u0444\u0438\u043a\u0435: \"+result.months;\n}\nfunction calculate(){\n  const x=read();\n  const result=simulate(x,x.n,x.extra);\n  if(!result){\n    [\"payment\",\"overpay\",\"total\",\"actualTerm\",\"interest\",\"freeMoney\",\"burden\",\"bestTerm\",\"saving\"].forEach(id=>$ (id).textContent=\"\u2014\");\n    $(\"budgetStatus\").textContent=\"\u0423\u043a\u0430\u0436\u0438\u0442\u0435 \u0441\u0443\u043c\u043c\u0443 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430.\";\n    $(\"budgetStatus\").className=\"status warn\";\n    $(\"scheduleTable\").innerHTML=\"\";\n    return;\n  }\n  const a=afford(x,result);\n  const all=scan(x);\n  const best=x.income?all.find(v=>v.safe):null;\n\n  $(\"payment\").textContent=money(result.first.payment);\n  $(\"paymentSub\").textContent=x.method===\"diff\"?\"\u043f\u0435\u0440\u0432\u044b\u0439 \u043f\u043b\u0430\u0442\u0451\u0436\":\"\u0435\u0436\u0435\u043c\u0435\u0441\u044f\u0447\u043d\u043e\";\n  $(\"overpay\").textContent=money(result.overpay);\n  $(\"total\").textContent=money(result.total);\n  $(\"actualTerm\").textContent=termText(result.months);\n  $(\"interest\").textContent=money(result.interest);\n  $(\"freeMoney\").textContent=a?money(a.available):\"\u2014\";\n  $(\"burden\").textContent=a?pct(a.burden):\"\u2014\";\n  $(\"burdenBar\").style.width=(a?clamp(a.burden,0,100):0)+\"%\";\n  $(\"burdenBar\").style.background=!a?\"#555\":a.burden\u003c=30?\"#6fbf95\":a.burden\u003c=40?\"#d9d3bd\":\"#d98982\";\n\n  const st=$(\"budgetStatus\");\n  if(!a){st.className=\"status warn\";st.textContent=\"\u0423\u043a\u0430\u0436\u0438\u0442\u0435 \u0434\u043e\u0445\u043e\u0434, \u0447\u0442\u043e\u0431\u044b \u043e\u0446\u0435\u043d\u0438\u0442\u044c \u043d\u0430\u0433\u0440\u0443\u0437\u043a\u0443.\";}\n  else if(a.available\u003c0){st.className=\"status warn\";st.textContent=\"\u041f\u043b\u0430\u0442\u0435\u0436\u0443 \u043d\u0435 \u0445\u0432\u0430\u0442\u0430\u0435\u0442 \u0431\u044e\u0434\u0436\u0435\u0442\u0430: \"+money(Math.abs(a.available));}\n  else if(a.burden>40){st.className=\"status warn\";st.textContent=\"\u041d\u0430\u0433\u0440\u0443\u0437\u043a\u0430 \u0432\u044b\u0441\u043e\u043a\u0430\u044f: \"+pct(a.burden);}\n  else{st.className=\"status good\";st.textContent=\"\u041f\u043b\u0430\u0442\u0451\u0436 \u0443\u043a\u043b\u0430\u0434\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0432 \u0431\u044e\u0434\u0436\u0435\u0442. \u0417\u0430\u043f\u0430\u0441 \"+money(a.available);}\n\n  if(best){\n    $(\"bestTerm\").textContent=termText(best.n);\n    $(\"bestPayment\").textContent=money(best.payment)+\" / \u043c\u0435\u0441\";\n    const max=all[all.length-1];\n    $(\"saving\").textContent=money(max?Math.max(0,max.overpay-best.overpay):0);\n    const rec=$(\"recommendation\");\n    rec.className=\"status good\";\n    rec.textContent=best.n\u003c=x.n\n      ?\"\u041a\u0440\u0430\u0442\u0447\u0430\u0439\u0448\u0438\u0439 \u0441\u0440\u043e\u043a \u0432 \u043f\u0440\u0435\u0434\u0435\u043b\u0430\u0445 40% \u043d\u0430\u0433\u0440\u0443\u0437\u043a\u0438\"+(best.n\u003cx.n?\" \u00b7 \u043a\u043e\u0440\u043e\u0447\u0435 \u0442\u0435\u043a\u0443\u0449\u0435\u0433\u043e\":\" \u00b7 \u0441\u043e\u0432\u043f\u0430\u0434\u0430\u0435\u0442 \u0441 \u0442\u0435\u043a\u0443\u0449\u0438\u043c\")+\".\"\n      :\"\u0414\u043b\u044f \u0442\u0435\u043a\u0443\u0449\u0435\u0433\u043e \u0441\u0440\u043e\u043a\u0430 \u043f\u043b\u0430\u0442\u0451\u0436 \u0442\u044f\u0436\u0451\u043b\u044b\u0439 \u2014 \u043b\u0443\u0447\u0448\u0435 \u0434\u043b\u0438\u043d\u043d\u0435\u0435.\";\n  }else{\n    $(\"bestTerm\").textContent=\"\u2014\";\n    $(\"bestPayment\").textContent=\"\";\n    $(\"saving\").textContent=\"\u2014\";\n    $(\"recommendation\").className=\"status warn\";\n    $(\"recommendation\").textContent=x.income?\"\u041d\u0435\u0442 \u0441\u0440\u043e\u043a\u0430 \u0432 \u0437\u0430\u0434\u0430\u043d\u043d\u044b\u0445 \u0440\u0430\u043c\u043a\u0430\u0445. \u041f\u0440\u043e\u0432\u0435\u0440\u044c\u0442\u0435 \u0441\u0443\u043c\u043c\u0443 \u0438 \u0434\u043e\u0445\u043e\u0434.\":\"\u041d\u0443\u0436\u0435\u043d \u0434\u043e\u0445\u043e\u0434 \u0434\u043b\u044f \u0440\u0435\u043a\u043e\u043c\u0435\u043d\u0434\u0430\u0446\u0438\u0438.\";\n  }\n  renderSchedule(result);\n}\n$(\"applyBest\").addEventListener(\"click\",()=>{\n  const x=read();\n  if(!x.income)return;\n  const best=scan(x).find(v=>v.safe);\n  if(!best)return;\n  $(\"months\").value=best.n;\n  calculate();\n});\n[\"amount\",\"rate\",\"months\",\"method\",\"income\",\"living\",\"other\",\"reserve\",\"extra\"].forEach(id=>{\n  $(id).addEventListener(\"change\",calculate);\n  $(id).addEventListener(\"input\",()=>{clearTimeout($(id)._t);$(id)._t=setTimeout(calculate,280);});\n});\n$(\"recalc\").addEventListener(\"click\",calculate);\ncalculate();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";

\n<script>\n(()=>{'use strict';\n\ndocument.body.classList.add('pre-token');\ntry{\n  const wl=JSON.parse(localStorage.getItem('mzbox-watchlist')||'[]');\n  if(Array.isArray(wl)&&wl.length){\n    const seen=new Set(); const clean=[];\n    for(const x of wl){const id=x&&x.uid!=null?String(x.uid):'';if(!id||seen.has(id))continue;seen.add(id);clean.push({uid:x.uid,ticker:x.ticker,name:x.name,currency:x.currency});}\n    localStorage.setItem('mzbox-watchlist',JSON.stringify(clean));\n  }\n  const pc=JSON.parse(localStorage.getItem('mzbox-portfolio-cache')||'null');\n  if(pc&&Array.isArray(pc.watchRows)){\n    const seen=new Set(); const clean=[];\n    for(const x of pc.watchRows){const id=x&&x.uid!=null?String(x.uid):'';if(!id||seen.has(id))continue;seen.add(id);clean.push(x);}\n    pc.watchRows=clean;\n    localStorage.setItem('mzbox-portfolio-cache',JSON.stringify(pc));\n  }\n}catch{}\nconst API='https://invest-public-api.tinkoff.ru/rest/';\nconst S={token:'',accounts:[],rows:[],portfolioRows:[],watchRows:[],timer:null,busy:false,lastRefresh:0,activeRequest:0,lifetimeAt:0,lifetimeValue:null,searchBusy:false,analysisUnlocked:true};\nconst $=id=>document.getElementById(id);\nconst fmt=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d})+' ₽':'—';\nconst fmtPrice=n=>{const x=Number(n);if(!Number.isFinite(x))return '—';const a=Math.abs(x);const digits=a>=100?2:a>=1?3:a>=.01?4:a>=.0001?6:8;return x.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:digits})+' ₽'};\nconst pct=n=>(Number(n)*100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';\nconst qtyFmt=n=>{const x=Number(n);if(!Number.isFinite(x))return '0';return x.toLocaleString('ru-RU',{maximumFractionDigits:Math.abs(x%1)>1e-9?4:0});};\nconst val=x=>{if(x==null)return 0;if(typeof x==='number')return x;if(typeof x==='string')return Number(x.replace(',','.'))||0;if(typeof x==='object'){if('units'in x||'na .token=saved;$('token').value=saved;lockToken();refreshPortfolio(true).then(async()=>{await restoreWatchlist();if(S.rows.length)startAuto();try{if(S.token&&!S.marketBusy&&!(marketCache&&marketCache.length)){setTimeout(()=>{scanMarket().then(()=>updateWelcomeRecs()).catch(()=>{})},1500)}}catch{}})}}catch{}\n\n// V21 welcome strip: live clock, local quote bank, weather and active order snapshot.\nconst quoteBank=[\n['Цена — это то, что вы платите. Ценность — то, что получаете.','Уоррен Баффетт'],\n['Риск возникает тогда, когда вы не понимаете, что делаете.','Уоррен Баффетт'],\n['В краткосрочной перспективе рынок голосует, в долгосрочной — взвешивает.','Бенджамин Грэм'],\n['Знайте, чем владеете, и понимайте, почему вы этим владеете.','Питер Линч'],\n['Большие деньги делаются не в покупке или продаже, а в ожидании.','Джесси Ливермор'],\n['Самый важный орган инвестора — желудок, а не мозг.','Питер Линч'],\n['Диверсификация — защита от незнания; она мало помогает тому, кто понимает свой риск.','Уоррен Баффетт · смысл высказывания'],\n['Инвестирование — это не соревнование по активности. Терпение тоже является решением.','Принцип долгосрочного инвестирования'],\n['Сначала сохраните капитал. Возможность заработать появится снова.','Принцип управления риском'],\n['Доходность без учёта риска — неполная характеристика результата.','Финансовый принцип'],\n['Не путайте удачный исход с хорошим решением: качество решения оценивают по информации, доступной в момент выбора.','Принцип анализа решений'],\n['Рынок не обязан подтверждать вашу гипотезу. Цена важнее убеждённости.','Торговая дисциплина'],\n['Если вы не можете объяснить, откуда берётся ожидаемая доходность, вы, вероятно, недооцениваете риск.','Принцип инвестиционного анализа'],\n['Время усиливает не только сложный процент, но и последствия постоянных ошибок.','Принцип долгосрочного капитала'],\n['План выхода важен не меньше плана входа.','Принцип управления позицией'],\n['Ликвидность нужна именно тогда, когда рынок перестаёт быть удобным.','Рыночная аксиома'],\n['Неопределённость нельзя устранить прогнозом. Её можно учитывать размером позиции и запасом прочности.','Принцип риск-менеджмента'],\n['Хорошая стратегия должна переживать не только удачные периоды, но и неблагоприятные режимы рынка.','Принцип проверки стратегии'],\n['Сложный процент работает на инвестора только при достаточном времени и дисциплине.','Принцип накопления капитала'],\n['Покупка актива — это начало ответственности за риск, а не завершение анализа.','Принцип инвестирования']\n];\nfunction updateWelcomeClock(){const d=new Date(),h=d.getHours();$('welcomeGreeting').textContent=(h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер')+', Дмитрий.';$('welcomeClock').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit'});$('welcomeDate').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}).toLocaleUpperCase('ru-RU');}\n\nconst MZ_WORDS=[\n {w:'Асимметрия риска',d:'Соотношение потенциальной прибыли и возможного убытка. Интересная возможность обычно имеет ограниченный понятный риск и более широкий потенциал роста; если возможный минус существенно больше плюса, требуется особенно сильное обоснование.'},\n {w:'Диверсификация',d:'Распределение капитала между активами, отраслями и факторами риска. Она снижает зависимость от одной компании или события, но не защищает от общего падения рынка, если активы сильно коррелируют.'},\n {w:'Ликвидность',d:'Возможность быстро купить или продать актив без заметного влияния на его цену. На ликвидность указывают оборот, глубина стакана и небольшой спред; в стрессовый момент она может резко ухудшиться.'},\n {w:'Волатильность',d:'Мера изменчивости цены за выбранный период. Высокая волатильность означает более широкий диапазон возможных движений, но сама по себе не говорит, куда пойдёт цена.'},\n {w:'Просадка',d:'Снижение стоимости портфеля от предыдущего максимума до последующего минимума. Важна не только глубина просадки, но и время восстановления: длительное восстановление может быть тяжелее краткого резкого падения.'},\n {w:'Максимальная просадка',d:'Наибольшее падение капитала от исторического пика до следующего дна за период наблюдения. Показатель помогает понять, какой убыток стратегия уже переживала, но не гарантирует, что будущая просадка не окажется больше.'},\n {w:'Ребалансировка',d:'Возврат долей активов к заранее выбранным пропорциям. Она дисциплинирует риск и не позволяет одной быстро выросшей позиции незаметно занять чрезмерную долю портфеля; частые операции при этом создают комиссии и налоги.'},\n {w:'Хеджирование',d:'Открытие позиции или использование инструмента, который компенсирует часть риска основного актива. Хедж не бесплатен: он может ограничить прибыль, иметь стоимость и не сработать идеально из-за несовпадения инструментов.'},\n {w:'Корреляция',d:'Статистическая мера того, насколько согласованно меняются доходности двух активов. Низкая корреляция помогает диверсифицировать портфель, но связь меняется во времени и в кризисы часто усиливается.'},\n {w:'Бета',d:'Оценка чувствительности доходности актива к движению выбранного рыночного индекса. Бета выше единицы обычно означает более сильные колебания относительно индекса, ниже единицы — более слабые; это историческая оценка, а не гарантия.'},\n {w:'Альфа',d:'Результат сверх доходности, объясняемой выбранным рыночным ориентиром и принятой моделью риска. Положительная альфа за короткий период может быть случайностью, поэтому важны длительность наблюдения, комиссии и сопоставимый бенчмарк.'},\n {w:'Бенчмарк',d:'Рыночный ориентир, с которым сравнивают результат портфеля или стратегии. Он должен соответствовать валюте, классу активов, географии и риску; неподходящий индекс создаёт ложное впечатление успеха или неудачи.'},\n {w:'Проскальзывание',d:'Разница между ценой, которую вы видели или ожидали, и фактической ценой исполнения. Оно растёт при низкой ликвидности, резком движении и крупных заявках; для реальной оценки стратегии его нужно учитывать вместе с комиссиями.'},\n {w:'Спред',d:'Разница между лучшей ценой покупки и лучшей ценой продажи в стакане. Это одна из непосредственных издержек сделки: чем шире спред, тем дороже вход и выход даже до учёта комиссии.'},\n {w:'Дюрация',d:'Приближённая мера чувствительности цены облигации к изменению процентных ставок. Чем выше дюрация, тем сильнее обычно меняется цена при одинаковом сдвиге доходностей; показатель не равен сроку до погашения.'},\n {w:'Купон',d:'Процентный доход по облигации, который эмитент выплачивает по установленному графику. Купон не равен полной доходности: на результат также влияют цена покупки, погашение, налоги, комиссии и риск эмитента.'},\n {w:'Доходность к погашению',d:'Расчётная годовая доходность облигации при удержании до погашения и выполнении заложенных предпосылок. Она зависит от цены, купонов и срока; фактический результат изменится, если продать бумагу раньше или эмитент нарушит обязательства.'},\n {w:'Контанго',d:'Ситуация, когда дальний фьючерс стоит дороже ближнего. Разница может отражать стоимость финансирования, хранения и ожидания; при переносе позиции она влияет на результат независимо от изменения спотовой цены.'},\n {w:'Бэквордация',d:'Ситуация, когда ближний фьючерс стоит дороже дальнего. Она может возникать при дефиците или высокой ценности немедленной поставки; форма кривой фьючерсов меняется и не является самостоятельным сигналом направления цены.'},\n {w:'Хвостовой риск',d:'Вероятность редкого, но очень крупного движения, которое плохо описывается обычными колебаниями. Его учитывают запасом ликвидности, ограничением размера позиции и сценариями стресс-тестирования.'},\n {w:'Регрессия к среднему',d:'Статистическая тенденция экстремальных значений со временем становиться ближе к типичному уровню. Это не закон немедленного разворота: сильный тренд или изменение фундаментальных условий могут удерживать цену на новом уровне.'},\n {w:'Эффект якоря',d:'Когнитивное искажение, при котором первое число — например, цена покупки или прежний максимум — чрезмерно влияет на оценку. Рынку безразлична ваша цена входа; решение лучше проверять по текущим данным и альтернативным сценариям.'},\n {w:'Стоимость упущенной возможности',d:'Результат лучшей из доступных альтернатив, от которой пришлось отказаться. При выборе актива сравнивайте не только ожидаемую прибыль, но и то, что капитал мог бы дать в другом инструменте или при сохранении ликвидности.'},\n {w:'Режим рынка',d:'Текущее сочетание тренда, волатильности, ликвидности и макроусловий. Один и тот же сигнал может вести себя по-разному в тренде и боковике, поэтому методику важно оценивать на нескольких режимах.'},\n {w:'Запас прочности',d:'Разница между консервативной оценкой стоимости и ценой, которую вы платите. Он снижает зависимость от точности прогноза и помогает пережить ошибку в предположениях, но не устраняет риск плохого бизнеса или структурного изменения.'},\n {w:'Денежный поток',d:'Реальное движение денег в компанию: поступления и выплаты. При анализе бизнеса важно отличать денежный поток от бухгалтерской прибыли, поскольку прибыль может включать начисления, которые ещё не превратились в деньги.'},\n {w:'Фундаментальный анализ',d:'Оценка бизнеса через выручку, прибыль, денежные потоки, долг, конкурентные преимущества и качество управления. Он помогает понять экономику компании, но справедливая стоимость всегда зависит от предположений о будущем.'},\n {w:'Технический анализ',d:'Изучение цены, объёма и структуры торгов для оценки поведения участников рынка. Его сигналы вероятностны: графические модели могут не сработать, поэтому их проверяют на истории и используют вместе с управлением риском.'},\n {w:'Байесовское обновление',d:'Способ менять оценку вероятности по мере появления новых фактов. Вместо жёсткой уверенности в одном прогнозе инвестор обновляет сценарии, учитывая, насколько новое наблюдение было ожидаемым.'},\n {w:'Фальсифицируемость',d:'Свойство гипотезы допускать проверку, которая может показать её ошибочность. Полезный прогноз должен заранее указывать, какие наблюдения подтвердят сценарий, а какие заставят от него отказаться.'},\n {w:'Иллюзия контроля',d:'Ощущение, что частые действия позволяют управлять случайными колебаниями рынка. Избыточная торговля увеличивает комиссии и вероятность эмоциональных ошибок, не гарантируя улучшения результата.'},\n {w:'Принцип Парето',d:'Эмпирическое наблюдение, что значительная часть результата нередко связана с небольшой долей причин. В портфеле это повод проверить концентрацию: несколько крупнейших позиций могут определять почти весь риск.'},\n {w:'Сложный процент',d:'Начисление дохода не только на первоначальный капитал, но и на ранее полученный доход. Эффект зависит от времени, ставки, регулярности пополнений и отсутствия крупных изъятий; он работает в обе стороны при убытках и долгах.'}\n];\n\nfunction chooseWelcomeQuote(){\n const qe=$('welcomeQuote');const ae=$('welcomeAuthor');\n let qIndex=Math.floor(Math.random()*quoteBank.length);\n try{const old=Number(sessionStorage.getItem('mzbox-quote-index'));if(quoteBank.length>1&&qIndex===old)qIndex=(qIndex+1)%quoteBank.length;sessionStorage.setItem('mzbox-quote-index',String(qIndex))}catch{}\n const q=quoteBank[qIndex]||['',''];\n let wordLine='';\n if(typeof MZ_WORDS!=='undefined'&&MZ_WORDS.length){\n  let wIndex=Math.floor(Math.random()*MZ_WORDS.length);\n  try{const old=Number(sessionStorage.getItem('mzbox-word-index'));if(MZ_WORDS.length>1&&wIndex===old)wIndex=(wIndex+1)%MZ_WORDS.length;sessionStorage.setItem('mzbox-word-index',String(wIndex))}catch{}\n  const x=MZ_WORDS[wIndex]; if(x) wordLine=x.w+' — '+x.d;\n }\n if(qe){qe.innerHTML=esc(q[0])+(wordLine?'<br><span class=\"welcome-term\">'+esc(wordLine)+'<\/span>':'');}\n if(ae)ae.textContent=q[1]?('— '+q[1]):'';\n}\nfunction markFooterDataUpdated(label='Данные обновлены',timestamp=Date.now()){const el=$('footerUpdated');if(!el)return;const d=new Date(Number(timestamp)||Date.now());el.textContent='Обновлено: '+d.toLocaleDateSt function openMzboxModule() {
  var overlay = document.getElementById("mzboxOverlay");
  var frame = document.getElementById("mzboxFrame");
  if (!overlay || !frame) { try { showToast("Оверлей не найден"); } catch(_){} return; }
  if (typeof MZBOX_HTML !== "string" || MZBOX_HTML.length < 5000) {
    try { showToast("MZBOX не встроен"); } catch(_){}
    return;
  }
  overlay.classList.remove("hidden");
  overlay.style.display = "flex";
  overlay.setAttribute("aria-hidden", "false");
  document.body.classList.add("mzbox-open");
  try {
    frame.removeAttribute("sandbox");
    frame.removeAttribute("src");
    var tok = "";
    try { tok = localStorage.getItem("mzbox-token") || localStorage.getItem("mzbox_token") || ""; } catch (_) {}
    if (tok) {
      try { localStorage.setItem("mzbox-token", tok); } catch (_) {}
    }
    var boot = "";
    if (tok) {
      boot = "<script>(function(){try{var t=" + JSON.stringify(tok) +
        ";localStorage.setItem('mzbox-token',t);}catch(e){}})();<\/script>";
    }
    var src = MZBOX_HTML;
    if (boot) {
      if (src.indexOf("<head>") >= 0) src = src.replace("<head>", "<head>" + boot);
      else src = boot + src;
    }
    frame.srcdoc = src;
  } catch (e) {
    console.error(e);
    try { showToast("Не удалось открыть MZBOX"); } catch(_){}
  }
}

function closeMzboxModule() {
  var overlay = document.getElementById("mzboxOverlay");
  var frame = document.getElementById("mzboxFrame");
  if (overlay) {
    overlay.classList.add("hidden");
    overlay.style.display = "none";
    overlay.setAttribute("aria-hidden", "true");
  }
  document.body.classList.remove("mzbox-open");
  try {
    if (frame) {
      frame.removeAttribute("srcdoc");
      frame.removeAttribute("src");
    }
  } catch (_) {}
  try {
    renderHome();
    if (currentSection === "FINANCES") renderFinancesView();
  } catch (_) {}
}
