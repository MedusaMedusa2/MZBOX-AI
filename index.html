<style>
/* MZBOX AI — чистый чёрный фон без жёлтого оттенка */
html,
body,
body.dark,
body.dark .app-main,
body.dark main,
body.dark .chart-wrap,
body.dark .chart {
    background-color: #000 !important;
    background-image: none !important;
}

body.dark::before,
body.dark::after,
html::before,
html::after {
    background: none !important;
    background-image: none !important;
}

body.dark .chart-wrap {
    border-color: #292929 !important;
}

body.dark .chart {
    display: block !important;
    width: 100%;
    max-width: 100%;
}
</style>

<script>
/* MZBOX AI — исправление переключения периодов графика */
(function () {
    'use strict';

    // Индивидуальные настройки для каждого инструмента.
    window.MZ_CHART_SETTINGS =
        window.MZ_CHART_SETTINGS || Object.create(null);

    // Заменяет исходную функцию chartSettings.
    window.mzboxGetChartSettings = function (i) {
        let key = 'idx:' + i;

        try {
            if (typeof S !== 'undefined' &&
                S.rows &&
                S.rows[i] &&
                S.rows[i].uid) {
                key = String(S.rows[i].uid);
            }
        } catch (_) {}

        return window.MZ_CHART_SETTINGS[key] ||
            (window.MZ_CHART_SETTINGS[key] = { period: 1 });
    };

    // Установка обработчиков переключения периода.
    if (!window.__mzboxChartFixInstalled) {
        window.__mzboxChartFixInstalled = true;

        document.addEventListener('click', function (event) {
            const button = event.target.closest('[data-chart-period]');
            if (!button) return;

            const index = Number(button.dataset.chartIndex);
            const period = Number(button.dataset.chartPeriod);

            if (!Number.isInteger(index) ||
                ![1, 7, 30].includes(period)) return;

            event.preventDefault();

            const key = (function () {
                try {
                    const row = S.rows[index];
                    if (row && row.uid) return String(row.uid);
                } catch (_) {}
                return 'idx:' + index;
            })();

            const settings = window.MZ_CHART_SETTINGS[key] ||
                (window.MZ_CHART_SETTINGS[key] = { period: 1 });

            settings.period = period;

            const toolbar = button.closest('[data-chart-tools], .chart-bar');
            if (toolbar) {
                toolbar.querySelectorAll('[data-chart-period]')
                    .forEach(function (item) {
                        item.classList.toggle(
                            'active',
                            Number(item.dataset.chartPeriod) === period
                        );
                    });
            }

            if (typeof paintChart === 'function') {
                paintChart(index);
            }
        }, true);
    }
})();
</script>
